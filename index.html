.fx-card{width:230px;text-align:center;background:var(--card);border-radius:30px;box-shadow:var(--sh2);padding:22px 20px 18px;animation:fxIn .5s cubic-bezier(.3,1.5,.5,1) both}
.fx-card.bye{animation:fxOut .35s ease-in both}
.fx-card .pigw{width:118px;margin:0 auto}
.fx-card b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--acc-text);margin-top:10px}
.fx-card b.minus{color:var(--muted)}
.fx-card span{font-size:14px;color:var(--muted);font-weight:600}
@keyframes fxIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fxOut{to{opacity:0;transform:scale(.9) translateY(-10px)}}

/* ---------- Animacije: pritisak, ulazak kartica, nagrada ---------- */
.xbtn,.pbtn,.mnow,.jopt-head,.wal-move,.emain,.toast button,button.note{transition:transform .32s cubic-bezier(.3,1.7,.5,1)}
.xbtn:active,.xbtn.is-pressed,.pbtn:active,.pbtn.is-pressed,.mnow:active,.mnow.is-pressed,.wal-move:active,.wal-move.is-pressed,.toast button:active,.toast button.is-pressed{transform:scale(.86);transition-duration:.08s}
.jopt-head:active,.jopt-head.is-pressed,.emain:active,.emain.is-pressed,button.note:active,button.note.is-pressed{transform:scale(.97);transition-duration:.08s}
.switch{transition:background .25s,transform .32s cubic-bezier(.3,1.7,.5,1)}
.switch:active,.switch.is-pressed{transform:scale(.92);transition-duration:.08s}
.switch:active::after,.switch.is-pressed::after{transform:scale(1.14,.88)}
.switch.on:active::after,.switch.on.is-pressed::after{transform:translateX(20px) scale(1.14,.88)}
.fab::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 3px var(--acc2);opacity:0;pointer-events:none}
.fab.ring::after{animation:fabRing .55s cubic-bezier(.2,.8,.3,1)}
@keyframes fabRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.65)}}
.stag{animation:cardIn .52s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--sd,0ms)}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.97)}to{opacity:1;transform:none}}
.okpop{position:fixed;left:50%;top:40%;z-index:87;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:linear-gradient(150deg,var(--acc2),var(--acc-deep));color:#fff;box-shadow:0 16px 36px rgba(22,163,74,.42);animation:okPop .95s cubic-bezier(.3,1.5,.5,1) both}
.okpop.amber{background:linear-gradient(150deg,#fcd34d,var(--amber));color:#3a2500;box-shadow:0 16px 36px rgba(217,119,6,.38)}
.okpop svg{width:44px;height:44px;stroke-width:2.8;animation:okTick .42s .1s cubic-bezier(.3,1.8,.5,1) both}
@keyframes okPop{0%{opacity:0;transform:scale(.35)}24%{opacity:1;transform:scale(1.1)}40%{transform:scale(.97)}52%{transform:scale(1)}76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translate3d(0,-16px,0) scale(.86)}}
@keyframes okTick{from{opacity:0;transform:scale(.2) rotate(-35deg)}to{opacity:1;transform:none}}

/* ---------- Dodaci: veliki brojevi, potvrda, nedeljni limit, niz, želje, rezime ---------- */
.hero-num.xl,.wal-num.xl{font-size:36px}
.hero-num.xxl,.wal-num.xxl{font-size:29px}
.wal-num.long{font-size:42px}
.ask{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:var(--overlay)}
.ask-card{width:100%;max-width:360px;background:var(--card);border-radius:24px;box-shadow:var(--sh2);padding:20px 18px 16px;animation:fxIn .35s cubic-bezier(.3,1.5,.5,1) both}
.ask-card p{margin:0 0 16px;font-size:16px;line-height:1.5}
.ask-card .btn{padding:0 10px;font-size:15.5px}
.lim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:-4px 0 10px}
.lim-top b{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.lim-top>span{font-size:14px;color:var(--muted);font-weight:650;text-align:right}
.lim-msg{font-size:14px;margin:10px 2px 0;line-height:1.45;color:var(--muted)}
.lim-msg.amber{color:var(--amber-text)}
.lim-msg.red{color:var(--red-text)}
.lim-act{margin-top:12px;white-space:normal;line-height:1.25;min-height:50px}
.lim-row+.lim-row{margin-top:14px}
.streak{display:flex;align-items:center;gap:14px}
.streak .fire{width:56px;height:56px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:30px;background:var(--amber-soft)}
.streak .sv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.streak .sv small{font-size:14px;color:var(--muted);font-weight:650;letter-spacing:0}
.streak .ss{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.miles{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.miles span{font-size:12px;font-weight:750;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.miles span.on{background:var(--acc-soft);color:var(--acc-text)}
.chal{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.chal .t{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.chal .d{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.chal .chips{margin-top:10px}
.chal .chip{font-size:14px;padding:0 13px}
.wish{background:var(--card2);border-radius:18px;padding:13px 14px;margin-top:10px}
.wish-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wish-top b{font-size:16px;font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish-top span{font-weight:750;white-space:nowrap}
.wish-sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wish .bar{margin-top:9px}
.wish-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wish-btns .btn{background:var(--card);font-size:15px;padding:0 8px}
.wish-btns .btn.primary{background:linear-gradient(150deg,var(--acc),var(--acc-deep))}
.wish-ask{font-weight:750;font-size:15px;margin-top:10px}
.wish-done{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:8px 2px;border-top:1px solid var(--line)}
.wish-done:first-of-type{border-top:0}
.wish-done b{color:var(--text);font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-odr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--acc-soft);color:var(--acc-text);border-radius:16px;padding:12px 14px;margin:0 0 4px}
.saved-odr>span{font-size:14px;font-weight:650}
.saved-odr b{font-size:22px;font-weight:800;white-space:nowrap}
.cmp{font-size:12px;font-weight:750;white-space:nowrap}
.cmp.up{color:var(--acc-text)}
.cmp.down{color:var(--red-text)}
.cmp.same{color:var(--muted)}
.leaks{margin-top:14px}
.leak{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.leak:first-of-type{border-top:0}
.leak i{font-style:normal;font-size:20px;text-align:center}
.leak span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leak span small{display:block;font-size:12.5px;color:var(--muted)}
.leak b{white-space:nowrap}
.sug-goal{background:var(--card2);border-radius:16px;padding:13px 14px;margin-top:14px;font-size:14.5px;line-height:1.5}
.sug-goal .btn{margin-top:10px}
.sum-h{font-size:15px;font-weight:750;margin:16px 2px 4px}
.pf-amt{font-size:30px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:6px 0 4px}
.pf-sub{text-align:center;font-size:14px;color:var(--muted);margin:0 0 14px}
.init-row{display:grid;grid-template-columns:1fr;gap:12px}

@media (hover:hover){
  .btn:not(.primary):not(:disabled):hover{filter:brightness(.97)}
  .day:not(.blank):hover{filter:brightness(.97)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}
}

/* ---------- Evro, nove kartice, dostignuća ---------- */
.money .inp{padding-right:66px}
.money.big .inp{padding:0 82px}
.unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:32px;min-width:44px;padding:0 10px;border:0;border-radius:99px;background:var(--soft);color:var(--muted);font-size:12.5px;font-weight:750;transition:background .2s,color .2s,transform .25s cubic-bezier(.3,1.7,.5,1)}
.unit::before{content:"";position:absolute;inset:-8px -4px}
.unit:active{transform:translateY(-50%) scale(.9)}
.money[data-cur="EUR"] .unit{background:var(--acc-soft);color:var(--acc-text)}
.money.big .unit{height:36px;min-width:50px;font-size:14px;right:14px}
.curpill{position:relative;height:44px;min-width:58px;padding:0 14px;border-radius:99px;border:0;background:var(--card);box-shadow:var(--sh1);font-weight:780;font-size:14.5px;color:var(--text);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.curpill:active{transform:scale(.9);transition-duration:.08s}
.hero-sub,.wal-sub{font-size:14px;font-weight:650;opacity:.85;margin:2px 0 4px;letter-spacing:0}
.streak-line{display:block;width:100%;border:0;margin-top:12px;padding:11px 14px;border-radius:14px;background:var(--amber-soft);color:var(--amber-text);font-size:14px;text-align:left;font-weight:600}
.fc-big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.fc-range{font-size:13.5px;color:var(--muted);margin:3px 0 12px}
.fc-vs{font-size:14px;font-weight:700;margin-top:8px}
.due-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--line2)}
.card-h + .due-row{border-top:0;padding-top:0}
.due-n{flex:1;min-width:0;display:flex;flex-direction:column}
.due-n b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-n small{color:var(--muted);font-size:12.5px;font-weight:600}
.due-row.late .due-n small{color:var(--red-text)}
.due-row.soon .due-n small{color:var(--amber-text)}
.chk{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--acc-soft);color:var(--acc-text);display:grid;place-items:center;padding:0;transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.chk:active{transform:scale(.86)}
.chk svg{width:22px;height:22px}
.linkbtn{display:block;width:100%;border:0;background:none;color:var(--acc-text);font-weight:700;font-size:14.5px;padding:10px 0 0;text-align:left}
.qline{display:flex;gap:12px;align-items:flex-start}
.qline .qi2{font-size:24px;line-height:1.2}
.qline small{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qline p{margin:3px 0 0;font-size:15.5px;line-height:1.4;font-weight:600}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{background:var(--card2);border-radius:16px;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bdg .bi{font-size:28px;line-height:1.1}
.bdg b{font-size:12.5px;line-height:1.2}
.bdg small{font-size:11px;color:var(--muted);line-height:1.25}
.bdg.off{opacity:.5}
.bdg.off .bi{filter:grayscale(1)}
.rate-box{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:var(--card2);border-radius:15px}
.rate-box .t{font-weight:700}
.rate-box .d{font-size:13px;color:var(--muted);margin-top:2px}
.snap-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--line2)}
.snap-row:first-child{border-top:0}
.snap-row b{display:block;font-weight:700;font-size:15px}
.snap-row small{color:var(--muted);font-size:12.5px}

/* ================= DIZAJN v2: kompaktno, tema, heatmap, bankar, animacije, Mac ================= */
/* Kompaktnije — dugmad i dalje ≥44px za palac */
.vh{padding:calc(env(safe-area-inset-top) + 10px) 2px 10px}
.vh h1{font-size:28px}
.vh-sub{font-size:12px}
.card{padding:15px;margin-bottom:10px}
.card-h{margin:0 0 10px}
.card-h h2{font-size:17.5px}
.acts{gap:10px;margin-bottom:12px}
.act{min-height:88px;padding:12px 14px;border-radius:20px;gap:6px}
.act .ai{width:38px;height:38px;border-radius:12px}
.tip{min-height:54px}
.tips{gap:8px}
.wc-head{min-height:56px;padding:11px 0 10px}
.wstack{margin:0 0 12px}
.stat{padding:10px 12px}
.stat .v{font-size:19px}
.sec-t{margin:16px 6px 6px}
.greet{white-space:nowrap}
#homeTitle{font-size:clamp(22px,7vw,28px)}
.view{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* Semantičke boje kartica */
.wc-wallet.minus{--a:#fb7185;--b:#be123c;--sh:rgba(190,18,60,.3)}
.wc-month.minus{--a:#fb923c;--b:#c2410c;--sh:rgba(194,65,12,.3)}
.wc-due.soon{--a:#fbbf24;--b:#b45309;--sh:rgba(180,83,9,.3)}
.wc-pend{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;width:100%;margin-top:10px;border:0;text-align:left;font:inherit;font-size:13.5px;color:inherit;background:rgba(255,255,255,.16);border-radius:12px;padding:9px 12px;line-height:1.35}

/* Kalendar: boja po zaradi (4 nivoa, kontrast ≥ 4,5:1) */
.day.work.h1{background:var(--hm1);color:var(--hm1t)}
.day.work.h1 .amt.w{color:var(--hm1t)}
.day.work.h1 .amt.t{color:var(--hm1a)}
.day.work.h2{background:var(--hm2);color:var(--hm2t)}
.day.work.h2 .amt.w{color:var(--hm2t)}
.day.work.h2 .amt.t{color:var(--hm2a)}
.day.work.h3{background:var(--hm3);color:var(--hm3t)}
.day.work.h3 .amt.w{color:var(--hm3t)}
.day.work.h3 .amt.t{color:var(--hm3a)}
.day.work.h4{background:var(--hm4);color:var(--hm4t)}
.day.work.h4 .amt.w{color:var(--hm4t)}
.day.work.h4 .amt.t{color:var(--hm4a)}
.legend .lg-heat{display:inline-flex;gap:2px}
.legend .lg-heat i{width:10px;height:12px;border-radius:3px}
.lg-heat i:nth-child(1){background:var(--hm1)}.lg-heat i:nth-child(2){background:var(--hm2)}.lg-heat i:nth-child(3){background:var(--hm3)}.lg-heat i:nth-child(4){background:var(--hm4)}
:root{--hm1:#cde2d5;--hm1t:#14532d;--hm1a:#8a4b06;--hm2:#a4ccb3;--hm2t:#14532d;--hm2a:#713f12;--hm3:#15803d;--hm3t:#fff;--hm3a:#fff;--hm4:#14532d;--hm4t:#fff;--hm4a:#fde68a}

/* Bankar: lik sa izrazom lica */
.bk-face{width:46px;height:46px;flex:none;border-radius:15px;background:var(--blue-soft);display:grid;place-items:center;overflow:hidden;margin-right:10px}
.bk-face svg{width:46px;height:46px}
.bk-face.happy{background:var(--acc-soft)}
.bk-face.worried{background:var(--amber-soft)}
.bk-face.strict{background:var(--red-soft)}
.bk-face .eyes{transform-origin:70px 69px;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bk-face.happy svg{animation:nod 2.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes nod{0%,70%,100%{transform:none}78%{transform:rotate(-4deg) translateY(1px)}86%{transform:rotate(3deg)}}
.bk-face.strict svg{animation:shake 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes shake{0%,80%,100%{transform:none}84%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}
.bk-face.worried svg{animation:sway 3.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:none}50%{transform:translateY(1.5px) rotate(-1.5deg)}}

/* Jače animacije */
.wc.open{transform:translateY(-2px) scale(1.012);box-shadow:0 22px 46px var(--sh,rgba(0,0,0,.25))}
.wc{transition:transform .5s cubic-bezier(.3,1.5,.5,1),box-shadow .4s}
.wc.lift::after{animation:sheen 1.1s .15s ease-out}
@keyframes sheen{0%{opacity:0;left:-70%}20%{opacity:1}100%{opacity:0;left:120%}}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:barShine 2.6s 1s ease-in-out infinite}
.bar>i{position:relative;overflow:hidden}
@keyframes barShine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.wc-big b.bump,.wc-n.bump{animation:bump .55s cubic-bezier(.3,1.7,.5,1)}
.card.stag,.tip.stag{animation-duration:.62s}
.view.in-r{animation:inR2 .42s cubic-bezier(.2,1.2,.35,1) both}
.view.in-l{animation:inL2 .42s cubic-bezier(.2,1.2,.35,1) both}
@keyframes inR2{from{opacity:0;transform:translate3d(42px,0,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes inL2{from{opacity:0;transform:translate3d(-42px,0,0) scale(.98)}to{opacity:1;transform:none}}
.btn.primary:not(:disabled){position:relative;overflow:hidden}
.btn.primary:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));animation:btnSheen 4.5s 1.5s ease-in-out infinite}
@keyframes btnSheen{0%,75%{left:-60%}100%{left:130%}}
.coinrain{position:fixed;top:-30px;z-index:88;width:22px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,#fff6c2,#f7c21b 52%,#c98a00);box-shadow:inset 0 0 0 2px rgba(150,100,0,.35);animation:coinFall 1.4s cubic-bezier(.4,0,.8,1) both}
@keyframes coinFall{0%{transform:translateY(0) rotate(0)}80%{opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}

/* Grafikoni: dodir = detalji, krug, linija štednje */
.bars .b{cursor:pointer}
.bars .b.sel i{outline:2px solid var(--text);outline-offset:1px}
.ctip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:var(--sh2);animation:fxIn .25s cubic-bezier(.3,1.5,.5,1) both}
.donut-w{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.donut{width:132px;height:132px}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray 1s cubic-bezier(.22,1,.36,1)}
.donut text{font-weight:800;fill:var(--text);font-size:15px}
.donut .sub{font-size:9.5px;fill:var(--muted);font-weight:650}
.dl{display:grid;gap:7px}
.dl div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.dl i{width:12px;height:12px;border-radius:4px}
.dl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.dl b{white-space:nowrap}
.sline{width:100%;height:120px;overflow:visible}
.sline .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLn 1.4s .2s cubic-bezier(.22,1,.36,1) forwards}
.sline .ar{fill:color-mix(in srgb,var(--acc) 16%,transparent)}
.sline circle{fill:var(--card);stroke:var(--acc);stroke-width:2.5}
.sline text{font-size:10px;fill:var(--muted);font-weight:650}
@keyframes drawLn{to{stroke-dashoffset:0}}

/* Mac i široki ekrani: dve kolone */
@media (min-width:960px){
  #app{max-width:1120px}
  .view{column-count:2;column-gap:22px;padding-left:24px;padding-right:24px}
  .view>header,.view>.msw,#homeAlert{column-span:all}
  .view>*{break-inside:avoid}
  .wstack,.acts,.tips,#jarsList,#summary,#walletCard{break-inside:avoid;page-break-inside:avoid}
  .view>.acts{display:grid}
  .tabbar{padding-left:calc(50% - 360px);padding-right:calc(50% - 360px)}
  .sheet{max-width:600px;border-radius:28px;margin-bottom:24px}
}

@media (prefers-reduced-motion: reduce){
  .bar>i::after,.btn.primary::after,.bk-face svg,.bk-face .eyes{animation:none!important}
}
</style>

<script>
(function(){
'use strict';

/* ================== Pomoćne funkcije ================== */
var KEY = 'mesecna-zarada.v1', SNAPKEY = 'mesecna-zarada.snaps', dataVer = 1;
var MONTHS = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
var DAYS = ['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
var WD = ['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
var $ = function(s, r){ return (r || document).querySelector(s); };

function fmt(n){
  n = Number(n);
  if (!isFinite(n)) n = 0;
  var r = Math.round(Math.abs(n));
  var s = r.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n < 0 && r > 0 ? '−' : '') + s;
}
/* ===== Valuta: podaci se uvek čuvaju u dinarima; evro je prikaz i način unosa ===== */
var DEF_RATE = 117.2;
function rate(){
  if (CS().rateMode === 'manual' && +CS().rateManual > 50) return +CS().rateManual;
  if (ui && ui.rate && +ui.rate.v > 50) return +ui.rate.v;
  return +CS().rateManual > 50 ? +CS().rateManual : DEF_RATE;
}
/* Valuta i kurs su u state.settings — isti na telefonu i Mac-u (sinhronizuju se); preuzeti dnevni kurs ostaje po uređaju */
function CS(){ return (typeof state !== 'undefined' && state && state.settings) || { cur: 'RSD', dual: 0, rateMode: 'auto', rateManual: 0 }; }
function isEur(){ return CS().cur === 'EUR'; }
function curLbl(){ return isEur() ? '€' : 'RSD'; }
function fmtE(e){
  e = Number(e);
  if (!isFinite(e)) e = 0;
  var r = Math.round(Math.abs(e) * 100) / 100, p = r.toFixed(2).split('.');
  return (e < 0 && r > 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1];
}
function fmtRate(v){ return (Math.round(v * 10000) / 10000).toString().replace('.', ','); }
/* cf = broj u izabranoj valuti (bez oznake), rsd = sa oznakom, other = u drugoj valuti */
function cf(n){ return isEur() ? fmtE(n / rate()) : fmt(n); }
function rsd(n){ return isEur() ? fmtE(n / rate()) + ' €' : fmt(n) + ' RSD'; }
function other(n){ return isEur() ? fmt(n) + ' RSD' : fmtE(n / rate()) + ' €'; }
function rsdD(n){ return rsd(n) + (CS().dual ? ' (≈ ' + other(n) + ')' : ''); }
function phFor(p){
  if (!isEur() || !p) return p || '0';
  var m = /^npr\. ([\d.]+)$/.exec(p);
  return m ? 'npr. ' + fmt(Math.round(parseInt(m[1].replace(/\./g, ''), 10) / rate())) : p;
}
/* Brzi iznosi: u evrima lepe okrugle vrednosti (5, 10, 20 €), u dinarima kao ranije */
function chipV(x){
  if (!isEur()) return { v: x, lbl: fmt(x) };
  var e = x % 100 === 0 ? x / 100 : Math.round(x / rate() * 100) / 100;
  return { v: Math.max(1, Math.round(e * rate())), lbl: fmtE(e).replace(/,00$/, '') + ' €' };
}
function presetChips(list, act, extra){
  return list.map(function(x){
    var c = chipV(x);
    return '<button type="button" class="chip num" data-act="' + act + '"' + (extra || '') + ' data-v="' + c.v + '">' + c.lbl + '</button>';
  }).join('');
}
function compact(n){ if (isEur()) { var e = n / rate(); return e < 10000 ? fmt(e) : Math.round(e / 1000) + 'k'; } return n < 100000 ? fmt(n) : Math.round(n / 1000) + 'k'; }
function short(n){ if (isEur()) n = n / rate(); return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + 'k' : String(Math.round(n)); }
/* Iznos: tačka = hiljade (1.500), zarez = decimale (1500,50); nalepljeno „1500.50“ prevodi formatLive. Čuva se ceo dinar (zaokruženo). */
function splitAmt(v){
  var s = String(v == null ? '' : v).replace(/[\s\u00a0]/g, ''), i = s.lastIndexOf(',');
  var ip = i < 0 ? s : s.slice(0, i), dp = i < 0 ? null : s.slice(i + 1).replace(/\D/g, '').slice(0, 2);
  return { int: ip.replace(/\D/g, '').slice(0, 10).replace(/^0+(?=\d)/, ''), dec: dp, sep: i };
}
function parseNum(v){
  var p = splitAmt(v);
  return (p.int ? parseInt(p.int, 10) : 0) + (p.dec ? parseInt(p.dec, 10) / Math.pow(10, p.dec.length) : 0);
}
/* Valuta jednog polja za iznos: dugme RSD / € pored polja */
function fieldCur(el){
  var w = el && el.closest ? el.closest('.money') : null;
  return w && w.getAttribute('data-cur') === 'EUR' ? 'EUR' : 'RSD';
}
/* parseAmt prima tekst (dinari) ili samo polje (tada čita i njegovu valutu); vraća ceo broj dinara */
function parseAmt(v){
  var c = 'RSD';
  if (v && typeof v === 'object') {
    var ex = v.getAttribute('data-rsd');
    if (ex && v.getAttribute('data-disp') === v.value) return toInt(ex);
    c = fieldCur(v); v = v.value;
  }
  var n = parseNum(v);
  if (c === 'EUR') n *= rate();
  return isFinite(n) && n > 0 ? Math.round(n) : 0;
}
function showIn(v, c){
  if (!v) return '';
  return c === 'EUR' ? fmtE(v / rate()).replace(/,00$/, '') : fmt(v);
}
function setAmt(el, v){
  if (!el) return;
  el.value = showIn(v, fieldCur(el));
  if (v) { el.setAttribute('data-rsd', v); el.setAttribute('data-disp', el.value); }
  else { el.removeAttribute('data-rsd'); el.removeAttribute('data-disp'); }
}
function plural(n, one, few, many){
  var a = Math.abs(n) % 10, b = Math.abs(n) % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
function dana(n){ return n + ' ' + plural(n, 'dan', 'dana', 'dana'); }
function radnih(n){ return n + ' ' + plural(n, 'radni dan', 'radna dana', 'radnih dana'); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function mkey(y, m){ return y + '-' + String(m + 1).padStart(2, '0'); }
function parseKey(k){ var p = k.split('-'); return { y: +p[0], m: +p[1] - 1 }; }
function shiftKey(k, delta){ var p = parseKey(k); var d = new Date(p.y, p.m + delta, 1); return mkey(d.getFullYear(), d.getMonth()); }
function dim(y, m){ return new Date(y, m + 1, 0).getDate(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
var TZF = null;
try { TZF = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Belgrade', year: 'numeric', month: '2-digit', day: '2-digit' }); } catch (e) {}
function nowParts(){
  var d = new Date();
  if (TZF && TZF.formatToParts) {
    try {
      var p = {};
      TZF.formatToParts(d).forEach(function(x){ p[x.type] = x.value; });
      var y = +p.year, m = +p.month - 1, dd = +p.day;
      if (y > 1970 && m >= 0 && m < 12 && dd >= 1) return { y: y, m: m, d: dd };
    } catch (e) {}
  }
  return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() };
}
function ds(y, m, d){ return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
function pd(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr(){ return ds(T.y, T.m, T.d); }
function daysBetween(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function addDaysStr(s, n){ var d = pd(s); d.setDate(d.getDate() + n); return ds(d.getFullYear(), d.getMonth(), d.getDate()); }
function fmtDate(s, year){ var d = pd(s); return d.getDate() + '. ' + MONTHS[d.getMonth()] + (year ? ' ' + d.getFullYear() : ''); }
function joinDays(list){
  var a = list.map(function(d){ return d + '.'; });
  if (a.length <= 1) return a.join('');
  return a.slice(0, -1).join(', ') + ' i ' + a[a.length - 1];
}
function roundUp(x){ return x <= 50 ? Math.ceil(x) : Math.ceil(x / 50) * 50; }
function isWork(r){ return !!(r && r.entries && r.entries.length); }
function isOff(r){ return !!(r && r.off && !isWork(r)); }
function hasStatus(r){ return isWork(r) || isOff(r); }
function sumDay(r){
  var s = 0;
  if (isWork(r)) r.entries.forEach(function(e){ s += (e.wage || 0) + (e.tip || 0); });
  return s;
}
function tipDay(r){ var s = 0; if (isWork(r)) r.entries.forEach(function(e){ s += e.tip || 0; }); return s; }
function spendDay(r){ var s = 0; if (r && r.spend) r.spend.forEach(function(x){ s += x.amount || 0; }); return s; }
function recAt(dateStr){
  var d = pd(dateStr), md = state.months[mkey(d.getFullYear(), d.getMonth())];
  return md ? md.days[d.getDate()] : null;
}

/* Vrste obaveza: ikonica, boja, redosled važnosti (manji = egzistencijalno važnije) */
var OB_TYPES = {
  home:   { l: 'Kirija i režije', s: 'kirija/režije', ic: 'home', c: 'b', col: '#3b82f6', rank: 1 },
  loan:   { l: 'Kredit / rata', s: 'rata', ic: 'bank', c: 'r', col: '#ef4444', rank: 2 },

function renderCalendar(){
  var p = parseKey(viewKey), y = p.y, m = p.m, n = dim(y, m);
  var md = monthFor(viewKey);
  var cmp = (y * 12 + m) - (T.y * 12 + T.m);
  var track = viewKey === curKey || (!!state.months[viewKey] && monthHasData(md)), fd = firstDate();
  var lead = (new Date(y, m, 1).getDay() + 6) % 7;
  var h = '', d, dueMap = {};
  md.expenses.forEach(function(e){ if (!e.due) return; var dd = Math.min(e.due, n); (dueMap[dd] = dueMap[dd] || []).push(e); });
  for (d = 0; d < lead; d++) h += '<div class="day blank"></div>';
  var hmax = 0; for (d = 1; d <= n; d++) hmax = Math.max(hmax, sumDay(md.days[d]));
  for (d = 1; d <= n; d++) {
    var r = md.days[d];
    var isToday = cmp === 0 && d === T.d;
    var isFuture = cmp > 0 || (cmp === 0 && d > T.d);
    var cls = 'day', inner = '<span class="dn">' + d + '</span>', desc;
    if (isWork(r)) {
      var tot = sumDay(r), ttp = tipDay(r), twg = tot - ttp;
      cls += ' work h' + heatLevel(tot, hmax);
      inner += '<span class="amt w">' + short(twg) + '</span>' + (ttp ? '<span class="amt t">+' + short(ttp) + '</span>' : '');
      if (r.entries.length > 1) inner += '<span class="multi">' + new Array(Math.min(r.entries.length, 3) + 1).join('<i></i>') + '</span>';
      desc = 'radni dan, dnevnica ' + rsd(twg) + ', bakšiš ' + rsd(ttp);
    } else if (isOff(r)) {
      cls += ' off'; desc = 'slobodan dan';
    } else if (isFuture) {
      cls += ' future'; desc = 'još nije došao';
    } else if (!isToday && track && ds(y, m, d) >= fd) {
      cls += ' missing'; inner += '<span class="amt">upiši</span>'; desc = 'neupisan';
    } else desc = 'nije upisan';
    if (spendDay(r) > 0) { inner += '<span class="sp"></span>'; desc += ', potrošeno ' + rsd(spendDay(r)); }
    var obs = dueMap[d];
    if (obs) {
      var o0 = obs.filter(function(e){ return !e.paid; })[0] || obs[0], allPaid = obs.every(function(e){ return e.paid; });
      inner += '<span class="obm' + (allPaid ? ' paid' : obs.every(function(e){ return e.paid || obFilled(e); }) ? ' full' : '') + '" style="--oc:' + OB_TYPES[typeOf(o0)].col + '">' + (obs.length > 1 ? obs.length : '') + '</span>';
      cls += ' hasob';
      desc += ', rok: ' + obs.map(function(e){ return e.name + ' ' + rsd(e.amount) + (e.paid ? ' plaćeno' : ''); }).join(', ');
    }
    if (isToday) { cls += ' today'; desc += ', danas'; }
    h += '<button type="button" class="' + cls + '" data-act="day" data-day="' + d + '" aria-label="' + d + '. ' + MONTHS[m] + ', ' + desc + '">' + inner + '</button>';
  }
  setHTML($('#calGrid'), h);
  var note = $('#calNote');
  if (cmp > 0) { note.hidden = false; note.textContent = 'Budući mesec — dodirni dan da vidiš ili upišeš obaveze sa tim rokom.'; }
  else if (!monthHasData(md) && cmp < 0) { note.hidden = false; note.textContent = 'Nema podataka za ovaj mesec. Dodirni dan ako želiš da ga upišeš.'; }
  else if (!state.months[viewKey]) { note.hidden = false; note.textContent = 'Za ovaj mesec još nema evidencije. Dodirni dan da počneš da upisuješ.'; }
  else note.hidden = true;
}

  out.push(['Dnevno treba', v2, s2]);

function spendEmoji(note){
  var e = '';

  if (e) return e;
  if (/prevoz|bus|taksi|taxi|gorivo|benzin|car ?go|parking|karta/i.test(note || '')) return '🚕';
  if (/market|maxi|idea|lidl|roda|univerexport|namirnic|pekar|hleb/i.test(note || '')) return '🛒';
  if (/kaf|caff|čaj|caj/i.test(note || '')) return '☕';
  if (/telefon|dopun|kredit/i.test(note || '')) return '📱';
  return '💸';
}

function renderWalFlow(){

/* ================== Šta je pametnije: obaveze pre kasica ================== */
/* Rang: kasni → kirija/režije → rate → telefon/pretplate → ostalo → pozajmice → Crni dani → ciljevi po roku → ostale kasice */
function smartTargets(){
  var out = [], keys = [curKey, shiftKey(curKey, 1)], t0 = todayStr();
  keys.forEach(function(k, ki){
    var md = monthFor(k);
    md.expenses.forEach(function(e){
      var need = obNeed(e); if (need <= 0) return;
      var dd = daysBetween(t0, dueDate(k, e));
      if (ki > 0 && dd > 35) return;
      var t = typeOf(e), late = dd < 0 && !!e.due, tier = late ? 0 : OB_TYPES[t].rank;
      var why = late ? 'kasni ' + dana(-dd) : (e.due ? (dd === 0 ? 'rok danas' : 'rok za ' + dana(dd)) : 'bez roka') + ' · ' + OB_TYPES[t].s;
      out.push({ kind: 'ob', key: k, e: e, id: e.id, name: e.name || 'Obaveza', t: t, need: need, s: tier * 1000 + Math.max(-999, Math.min(999, dd)), why: why, late: late });
    });
  });
  state.jars.forEach(function(j, i){
    var p = jarPlan(j); if (p.done || !(j.target > 0)) return;
    var s = j.kind === 'emergency' ? 5000 : p.overdue ? 6000 : p.daysToDeadline != null ? 6000 + Math.min(999, p.daysToDeadline) : 7000 + i;
    var why = j.kind === 'emergency' ? 'rezerva za crne dane' : p.overdue ? 'rok kasice je prošao' : p.daysToDeadline != null ? 'rok ' + fmtDate(j.deadline, true) : 'kasica bez roka';
    out.push({ kind: 'jar', j: j, id: j.id, name: j.name, need: p.need, pct: p.pct, s: s, why: why });
  });
  return out.sort(function(a, b){ return a.s - b.s; });
}
function targetIc(x){ return x.kind === 'ob' ? obIc(x.t) : '<span class="obi t-jar">' + ic('pig') + '</span>'; }
/* Stavlja novac u izabrani cilj: koverta obaveze ili kasica. Vraća stvarno stavljen iznos. */
function putInto(x, a, note){
  if (x.kind === 'ob') {
    ensureMonth(x.key); var e = findExp(x.key, x.id); if (!e) return 0;
    a = Math.min(a, obNeed(e)); if (a <= 0) return 0;
    e.saved = (e.saved || 0) + a;
    state.wallet.push({ id: uid(), date: todayStr(), amount: -a, note: 'Koverta „' + (e.name || 'Obaveza') + '“', kind: 'al', ref: 'ob:' + x.key + ':' + e.id });
    return a;
  }
  a = Math.min(a, jarPlan(x.j).need); if (a <= 0) return 0;
  state.jarTx.push({ id: uid(), jarId: x.j.id, date: todayStr(), amount: a, note: note || '' });
  state.wallet.push({ id: uid(), date: todayStr(), amount: -a, note: 'U kasicu „' + x.j.name + '“', kind: 'jar' });
  return a;
}

/* ---------- Grafikoni ---------- */
function renderWeek(){
  var t = todayStr(), back = (pd(t).getDay() + 6) % 7, start = addDaysStr(t, -back), end = addDaysStr(start, 6);
  var earned = 0, spent = 0, saved = 0, work = 0;
  for (var i = 0; i < 7; i++) {
    var s = addDaysStr(start, i), r = recAt(s);
    earned += sumDay(r); spent += spendDay(r); if (isWork(r)) work++;
  }
  state.jarTx.forEach(function(x){ if (x.date >= start && x.date <= end) saved += x.amount; });   // neto: ubačeno − izvađeno
  var a = pd(start), b = pd(end);
  var range = a.getMonth() === b.getMonth() ? a.getDate() + '.–' + b.getDate() + '. ' + MONTHS[b.getMonth()] : a.getDate() + '. ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + '. ' + MONTHS[b.getMonth()];
  var msg;
  if (!work && !spent && !saved) msg = 'Ove nedelje još nema upisa.';
  else {
    msg = radnih(work) + ' ove nedelje.';
    if (saved < 0) msg += ' Iz kasica je izvađeno ' + rsd(-saved) + ' više nego što je ubačeno.';
    else if (earned > 0 && saved <= earned && spent <= earned) msg += ' Od zarade si odvojio ' + Math.round(saved / earned * 100) + '%, a potrošio ' + Math.round(spent / earned * 100) + '%.';
    else if (earned > 0 && saved > earned) msg += ' Odvojio si više nego što si zaradio — odlično.';
  }
  setHTML($('#weekCard'), '<div class="card-h"><h2>' + hic('cal', 'b') + 'Ova nedelja</h2><span class="hint" style="margin:0">' + range + '</span></div>' +
    '<div class="week num"><div><div class="k">Zarađeno</div><div class="v">' + countSpan('wk-e', earned) + '</div></div>' +
    '<div><div class="k">Potrošeno</div><div class="v">' + countSpan('wk-s', spent) + '</div></div>' +
    '<div><div class="k">Odvojeno</div><div class="v">' + countSpan('wk-o', saved) + '</div></div></div>' +
    '<p class="week-msg">' + msg + '</p>');
}
function renderCharts(){

    if (isWork(r)) { var w = (pd(s).getDay() + 6) % 7; sum[w] += tipDay(r); cnt[w]++; }
  }

    vals.forEach(function(v, i){
      var hp = Math.max(v ? 2 : 0, v / mx * 100);

    });

    h += '</div>';
  } else h += '<p class="cap">Još nema upisane potrošnje za ovaj mesec. Dodaje se preko „Potrošio sam“, dugmetom + ili dodirom na dan.</p>';
  setHTML($('#chartSpend'), h);

  // Bakšiš kroz mesec
  var tv = [], ttot = 0, tdays = 0;

(function(){

  function down(e){
    if (e.target.closest('button,input')) return;
    on = true; y0 = e.clientY; dy = 0; t0 = Date.now(); ov.classList.add('drag');
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
  }
  function move(e){
    if (!on) return;
    dy = Math.max(0, e.clientY - y0);
    sh.style.transform = 'translate3d(0,' + dy + 'px,0)';
    bd.style.opacity = String(Math.max(0, 1 - dy / 420));
  }
  function up(){
    if (!on) return;
    on = false; ov.classList.remove('drag');
    var v = dy / Math.max(1, Date.now() - t0);
    if (dy > 110 || (dy > 30 && v > 0.55)) closeSheet();
    else { sh.style.transform = ''; bd.style.opacity = ''; }
  }
  ['.grab', '#sheetHead'].forEach(function(sel){
    var el = $(sel);
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });

/* ================== Akcije sa novcem ================== */
function deposit(jarId, amount, note, noWallet, acc){
  var j = jarById(jarId); if (!j || !(amount > 0)) return;
  var before = jarPlan(j).pct;
  state.jarTx.push({ id: uid(), jarId: jarId, date: todayStr(), amount: amount, note: note || '' });
  if (!noWallet) {
    var wt = { id: uid(), date: todayStr(), amount: -amount, note: 'U kasicu „' + j.name + '“', kind: 'jar' };
    if (acc === 'bank') wt.acc = 'bank';
    state.wallet.push(wt);
  }
  coinHold['jar-' + j.id] = true;
  save(); renderAll();
  sfx('cash');
  var p = jarPlan(j), mile = 0;
  [25, 50, 75, 100].forEach(function(th){ if (before < th && p.pct >= th) mile = th; });
  coinFx(j, before, p.pct, 1, amount);
  if (mile === 100) { confetti(); sfx('win'); toast('Kasica „' + j.name + '“ je puna! ' + rsd(p.saved) + ' ušteđeno.'); }
  else if (mile) { confetti(); sfx('win'); toast((mile === 50 ? 'Pola puta' : mile + '% puta') + ' do „' + j.name + '“! Još ' + rsd(p.need) + '.'); }
  else toast('Ubačeno ' + rsd(amount) + ' · ' + j.name + ' ' + Math.floor(p.pct) + '% · još ' + rsd(p.need));
}
function withdraw(jarId, amount, note){
  var j = jarById(jarId); if (!j) return;
  amount = Math.min(amount, jarSaved(jarId));
  if (!amount) return;
  var before = jarPlan(j).pct;
  state.jarTx.push({ id: uid(), jarId: jarId, date: todayStr(), amount: -amount, note: note || '' });
  state.wallet.push({ id: uid(), date: todayStr(), amount: amount, note: 'Iz kasice „' + j.name + '“', kind: 'jar' });
  coinHold['jar-' + j.id] = true;
  save(); renderAll(); sfx('out');
  coinFx(j, before, jarPlan(j).pct, -1, amount);
  toast('Izvađeno ' + rsd(amount) + ' iz „' + j.name + '“');
}
/* Rate u tekućem i već otvorenim budućim mesecima prate dug (iznos, rok, prva rata, otplata) */
function syncRataForDebt(d){
  ensureMonth(curKey);
  Object.keys(state.months).forEach(function(k){
    if (k < curKey) return;
    var md = state.months[k], ex = md.expenses.filter(function(e){ return e.debtId === d.id; })[0];
    if (ex && ex.paid) return;
    var amt = rataFor(d, k);
    if (ex) {
      ex.name = (d.type === 'person' ? 'Vraćam: ' : 'Rata: ') + d.name; ex.due = d.dueDay;
      if (amt > 0) ex.amount = amt;
      else if (!(ex.saved > 0)) md.expenses = md.expenses.filter(function(e){ return e !== ex; });
    } else if (amt > 0) { var r = rataExpense(d); r.amount = amt; md.expenses.push(r); }
  });
}

function heroSize(s){ var n = s.length; return n <= 8 ? '' : n <= 10 ? ' long' : n <= 12 ? ' xl' : ' xxl'; }
/* Rok (dan u mesecu): prazno = bez roka (0); van 1–31 = poruka i -1 */
function dueVal(el){
  var v = el ? String(el.value).trim() : '';
  if (!v) return 0;
  var n = parseInt(v, 10);
  if (!isFinite(n) || n < 1 || n > 31) { toast('Rok je dan u mesecu — od 1 do 31.'); focusNow(el); return -1; }
  return n;
}

function billDue(ex){ return Math.max(0, (ex.amount || 0) - (ex.saved || 0)); }
function openPayBill(key, ex){

function setBillPaid(key, id, paid, acc){
  var md = ensureMonth(key), ex = md.expenses.filter(function(x){ return x.id === id; })[0];
  if (!ex) return;
  var ref = key + ':' + ex.id, wref = 'bill:' + key + ':' + ex.id, due = billDue(ex), back = 0;
  ex.paid = paid;
  if (ex.debtId && state.debts.some(function(x){ return x.id === ex.debtId; })) {
    state.debtTx = state.debtTx.filter(function(x){ return x.ref !== ref; });
    if (paid && due > 0) state.debtTx.push({ id: uid(), debtId: ex.debtId, date: todayStr(), amount: due, ref: ref });
  }
  state.wallet = state.wallet.filter(function(t){ if (t.ref === wref) { back -= t.amount; return false; } return true; });
  if (paid && due > 0 && (acc === 'cash' || acc === 'bank')) {
    var t = { id: uid(), date: todayStr(), amount: -due, note: 'Plaćeno: ' + (ex.name || 'Trošak'), kind: 'bill', ref: wref };
    if (acc === 'bank') t.acc = 'bank';
    state.wallet.push(t);
  }
  save(); renderAll();
  if (paid) {
    sfx('out');
    var cb = byAttr($('#expCard'), 'data-id', id);
    if (cb && !reduced()) cb.classList.add('pop');
    toast('Plaćeno: ' + (ex.name || 'Trošak') + (acc === 'cash' ? ' · −' + rsd(due) + ' iz keša' : acc === 'bank' ? ' · −' + rsd(due) + ' sa računa' : ''));
  } else if (back > 0) toast('Vraćeno u novčanik: ' + rsd(back));
}

/* ================== Nedelja pon–ned (za izazov nedelje) ================== */
function weekStartOf(s){ return addDaysStr(s, -((pd(s).getDay() + 6) % 7)); }
function weekSpend(start, upTo){
  var s = 0;
  for (var i = 0; i < 7; i++) { var d = addDaysStr(start, i); if (upTo && d > upTo) break; s += spendDay(recAt(d)); }
  return s;
}

/* ================== Limiti potrošnje (dnevni i mesečni) + ostatak dana ================== */
function limBar(key, spent, lim, label, extra){
  var pct = lim > 0 ? spent / lim * 100 : 0, cls = pct >= 100 ? 'red' : pct >= 80 ? 'amber' : '', left = lim - spent;
  return '<div class="lim-row"><div class="bar-meta num" style="margin:0 0 6px"><span><b>' + label + '</b> · ' + rsd(spent) + ' od ' + rsd(lim) + '</span>' +
    '<span class="' + (left < 0 ? 'neg' : '') + '">' + (left >= 0 ? 'ostalo <b>' + rsd(left) + '</b>' : 'preko ' + rsd(-left)) + '</span></div>' + bar(key, pct, cls) + (extra || '') + '</div>';
}
function dayLeftFor(date){
  var ld = dailyBudget(date);
  if (!ld) return 0;
  return Math.max(0, ld - spendDay(recAt(date)));
}
function renderLimits(){
  var L = limitInfo(), card = $('#limitCard');

  if (L.ld) h += limBar('lim-d', L.td, L.ld, 'Danas');

  }

  if (L.ld && lt > 0 && new Date().getHours() >= 20 && !state.kv['dl:' + t])
    h += '<button type="button" class="btn block lim-act" data-act="dl-left" data-d="' + t + '">' + ic('pig') + 'Kraj dana: ostalo ' + rsd(lt) + ' — gde da prebacim?</button>';
  setHTML(card, h);

/* Juče je ostalo od dnevnog limita, a još nije odlučeno gde ide */
function yesterdayLeft(){
  if (!state.settings.bankEve && !state.settings.limitDay) return null;
  var y = addDaysStr(todayStr(), -1);
  if (!dailyBudget(y)) return null;
  if (state.kv['dl:' + y] || y < firstDate() || !recAt(y)) return null;
  var left = dayLeftFor(y);
  if (left > 0 && !state.settings.limitDay && bankCtx().free < 0) return null;   // kad para fali do plate, ostatak ostaje za život
  return left > 0 ? { d: y, left: left } : null;
}
function openDayLeft(date){

  var avail = availJars(), a = activeJar();

/* ================== LIČNI BANKAR ==================
   Računa koliko ti treba za život do plate (po tvom proseku potrošnje), šta kasni ili uskoro dospeva,

  var avgDaily = days >= 5 && sp > 0 ? sp / days : (state.settings.limitDay || 1000);

  var payDay = pays.length >= 2 ? Math.round(pays.reduce(function(a, b){ return a + b; }, 0) / pays.length) : 0;

  var late = monthFor(curKey).expenses.filter(function(e){ return dueState(e, st) === 'late' && billDue(e) > 0; });

function bankPlan(amount, mode, src){

  var rate = { smart: 0.4, save: 0.65, easy: 0.2 }[mode] || 0.4;
  if (mode === 'smart') {
    if (c.onTrack && c.free >= 0) { rate += 0.1; why.push('Mesec ide dobro — više ide u štednju.'); }
    if (c.late.length || c.cash < 0 || c.bank < 0) { rate -= 0.1; }

  if (good && mode !== 'easy') why.push('Dobar dan: bakšiš ' + Math.round((amount / c.avgTip - 1) * 100) + '% iznad proseka. Pola viška ide sa strane.');

/* ================== BAKŠIŠ: odmah na dug i/ili u štednju ==================
   Bakšiš uvek ulazi u keš (raspoloživ za trošenje). Posle upisa bankar nudi da deo odmah ode na dug (smanjuje ga odmah)
   ili u kasicu — u procentima, dug je uvek prvi. */
var TIP_PCTS = [0, 10, 25, 50, 100];
function r10(x){ return Math.round(x / 10) * 10; }
function openDebts(){ return state.debts.filter(function(d){ return debtLeft(d) > 0; }); }
function tipAdvice(tip){
  var c = bankCtx(), debts = openDebts().length > 0, jars = availJars().length > 0, good = c.avgTip > 0 && tip > c.avgTip * 1.15;
  var r = { d: 0, s: 0, why: '' };

  if (c.late.length) { r.why = 'Kasni ' + c.late.map(function(e){ return e.name || 'račun'; }).join(', ') + '. Bakšiš čuvaj za to — plati danas.'; return r; }
  if (c.free < 0) {
    r.why = 'Do plate ti fali ' + rsd(Math.ceil(-c.free)) + ' za život. Bakšiš ostaje u novčaniku' + (jars && tip >= 1000 ? ', osim 10% za kasicu.' : '.');
    if (jars && tip >= 1000) r.s = 10;
    return r;
  }
  if (debts) { r.d = good ? 50 : 25; r.s = jars ? 10 : 0; r.why = (good ? 'Dobar dan. ' : '') + 'Dug je prvi: ' + r.d + '% ide na dug' + (r.s ? ', ' + r.s + '% u kasicu' : '') + '. Ostatak troši pametno.'; }
  else if (jars) { r.s = good ? 50 : 25; r.why = (good ? 'Dobar dan — bakšiš iznad proseka. ' : '') + r.s + '% ide u kasicu. Bez rasprave.'; }
  return r;
}
function openTipSheet(tip, key, d){
  tip = Math.round(tip);

  var debts = openDebts(), jars = availJars(), adv = tipAdvice(tip), aj = activeJar();
  if (!debts.length && !jars.length) { toast('Bakšiš ' + rsd(tip) + ' je u kešu. Nema duga ni otvorene kasice.'); return; }
  sheet = { mode: 'tip', tip: tip, key: key || curKey, d: d || T.d, adv: adv, dp: debts.length ? adv.d : 0, sp: jars.length ? adv.s : 0,
    debtId: debts.length ? debts[0].id : '', jarId: jars.length ? (aj && jars.indexOf(aj) >= 0 ? aj : jars[0]).id : '' };

}
function tipAmounts(){

  if (dbt) dA = Math.min(dA, debtLeft(dbt)); else dA = 0;

}
function tipRow(kind, label, pct, rec, pick){

}
function renderTipSheet(){

function doTipSheet(){

/* ================== REZERVACIJE IZ NEISPLAĆENIH DNEVNICA ==================
   Zarađene dnevnice koje još nisu legle („Stiže na platu“) možeš unapred da rasporediš: računi i rate, dug, kasice.
   Kad upišeš da je plata legla, rezervisano se izvrši samo (sa računa); ako legne manje — pitam šta da skratim. */
var RES_CAP = 0.8;   // oprezno: najviše 80% zarađenog — plata zna da kasni ili bude manja

  var out = [];

    var st = computeStats(md, k);
    Object.keys(st.jobs).forEach(function(j){
      var jb = st.jobs[j];

      var reserved = resSum(resWait(k, j));
      out.push({ key: k, jobId: j, name: jb.name, wages: jb.wages, days: jb.days, reserved: reserved, max: Math.max(0, Math.floor(jb.wages * RES_CAP) - reserved) });

}
function unpaidTotals(){

}
/* Red „Stiže na platu“ za novčanik (na Početnoj i u Kasicama) */
function pendingLine(cls){
  var U = unpaidTotals();
  if (!U.list.length) return '';
  return '<button type="button" class="' + cls + '" data-act="res-open">📥 Stiže na platu <b class="num">' + rsd(U.wages) + '</b>' +
    (U.reserved ? ' · rezervisano <b class="num">' + rsd(U.reserved) + '</b> · ostaje ' + rsd(U.wages - U.reserved) : ' · nije u kešu ni na kartici') +

}
function resTargets(key){

    if (e.paid) return;
    var res = resSum(state.res.filter(function(r){ return r.st === 'wait' && r.t === 'e' && r.tid === e.id && r.eKey === curKey; }));
    var need = Math.max(0, billDue(e) - res);
    if (need > 0) rows.push({ t: 'e', tid: e.id, eKey: curKey, name: e.name || 'Trošak', need: need, due: e.due, debt: !!e.debtId, ds: dueState(e, st) });
  });
  rows.sort(function(a, b){ return (a.ds === 'late' ? 0 : 1) - (b.ds === 'late' ? 0 : 1) || (a.due || 99) - (b.due || 99); });
  openDebts().forEach(function(d){
    var res = resSum(state.res.filter(function(r){ return r.st === 'wait' && r.t === 'd' && r.tid === d.id; }));
    var need = Math.max(0, debtLeft(d) - res);
    if (need > 0) rows.push({ t: 'd', tid: d.id, name: 'Dodatno na dug: ' + d.name, need: need });
  });
  availJars().forEach(function(j){
    var res = resSum(state.res.filter(function(r){ return r.st === 'wait' && r.t === 'j' && r.tid === j.id; }));
    var need = Math.max(0, jarPlan(j).need - res);
    if (need > 0) rows.push({ t: 'j', tid: j.id, name: 'Kasica: ' + j.name, need: need });
  });

}
function openResSheet(key, jobId, pre){
  var U = unpaidList();

  var u = U.filter(function(x){ return x.key === key && x.jobId === jobId; })[0] || U[U.length - 1];
  sheet = { mode: 'res', key: u.key, jobId: u.jobId, rows: resTargets(u.key), vals: {} };
  if (pre) sheet.vals[pre.rk] = Math.min(pre.amount, u.max);

}
function renderResSheet(){

  if (U.length > 1) h += '<div class="chips" style="margin-bottom:10px">' + U.map(function(x){
    return '<button type="button" class="chip' + (x === u ? ' on' : '') + '" data-act="res-pick" data-k="' + esc(x.key) + '" data-j="' + esc(x.jobId) + '">' + esc(x.name) + ' · ' + MONTHS[parseKey(x.key).m] + '</button>'; }).join('') + '</div>';
  h += '<div class="calc">' + crow('Zarađeno, još nije leglo', esc(u.name) + ' · ' + MONTHS[parseKey(u.key).m] + ' · ' + radnih(u.days), cf(u.wages)) +
    crow('Već rezervisano', '', cf(u.reserved)) +

  var mine = resWait(u.key, u.jobId);
  if (mine.length) h += '<div class="sum-h">Rezervisano iz ove plate</div>' + mine.map(function(r){
    return '<div class="tx"><span class="note2">' + esc(r.name) + '</span><b class="num">' + cf(r.amount) + '</b><button type="button" class="xbtn" data-act="res-del" data-id="' + esc(r.id) + '" aria-label="Poništi">' + ic('x') + '</button></div>';
  }).join('');
  h += '<div class="sum-h">Dodaj rezervaciju</div>';
  if (!o.rows.length) h += '<p class="hint" style="margin-top:0">Nema neplaćenih računa, dugova ni otvorenih kasica.</p>';
  h += '<div class="bk-rows">' + o.rows.map(function(rw){
    var tag = rw.t === 'e' ? (rw.ds === 'late' ? '<span class="badge red">kasni</span>' : rw.debt ? '<span class="badge gray">rata</span>' : '<span class="badge amber">račun' + (rw.due ? ' · rok ' + rw.due + '.' : '') + '</span>')
      : rw.t === 'd' ? '<span class="badge gray">dug</span>' : '<span class="badge green">štednja</span>';
    return '<div class="bk-row"><div><b>' + esc(rw.name.replace(/^Kasica: /, '🫙 ').replace(/^Dodatno na dug: /, '💳 ')) + '</b><small>' + tag + ' fali ' + rsd(rw.need) + '</small></div>' +

function resAdded(){ return Object.keys(sheet.vals).reduce(function(s, k){ return s + (sheet.vals[k] || 0); }, 0); }
function updResSum(){
  var el = $('#resSum'); if (!el || !sheet || sheet.mode !== 'res') return;
  var u = unpaidList().filter(function(x){ return x.key === sheet.key && x.jobId === sheet.jobId; })[0], add = resAdded(), max = u ? u.max : 0;
  el.className = 'bk-sum' + (add > max ? ' warn' : '');
  el.innerHTML = add > max ? 'Rezervišeš <b>' + rsd(add) + '</b>, a oprezno možeš najviše <b>' + rsd(max) + '</b>. Smanji.'

}
/* Bankar: prvo računi po roku, pa dug, pa 10% plate u kasicu */
function resSuggest(){
  var u = unpaidList().filter(function(x){ return x.key === sheet.key && x.jobId === sheet.jobId; })[0];
  var left = u ? u.max : 0, v = {};
  sheet.rows.forEach(function(rw){ if (rw.t === 'e' && left > 0) { var a = Math.min(rw.need, left); v[rw.rk] = a; left -= a; } });
  sheet.rows.forEach(function(rw){ if (rw.t === 'd' && left > 0) { var a = Math.min(rw.need, r50(left * 0.5)); if (a > 0) { v[rw.rk] = a; left -= a; } } });
  var j1 = sheet.rows.filter(function(rw){ return rw.t === 'j'; })[0];
  if (j1 && left > 0 && u) { var a2 = Math.min(j1.need, left, r50(u.wages * 0.1)); if (a2 > 0) v[j1.rk] = a2; }
  sheet.vals = v;
  renderResSheet();
}
function doResSheet(){
  var o = sheet, u = unpaidList().filter(function(x){ return x.key === o.key && x.jobId === o.jobId; })[0], add = resAdded();
  if (!add) { toast('Upiši iznos bar za jednu stavku.'); return; }
  if (!u || add > u.max) { toast('Najviše možeš da rezervišeš ' + rsd(u ? u.max : 0) + '.'); return; }
  o.rows.forEach(function(rw){
    var a = Math.min(o.vals[rw.rk] || 0, rw.need);
    if (a <= 0) return;
    var r = { id: uid(), key: o.key, jobId: o.jobId, t: rw.t, tid: rw.tid, amount: a, name: rw.name.replace(/^Kasica: /, '').replace(/^Dodatno na dug: /, 'Dug: '), st: 'wait', made: todayStr() };
    if (rw.eKey) r.eKey = rw.eKey;
    state.res.push(r);
  });
  save(); closeSheet(); renderAll(); okPop();
  toast('Rezervisano ' + rsd(add) + ' iz plate · izvršiće se samo kad plata legne');

/* Izvrši rezervacije kad plata legne. Vraća iznos koji je raspoređen (ili -1 ako čeka tvoju odluku). */
function runReservations(key, jobId, pay){
  var list = resWait(key, jobId);
  if (!list.length) return 0;
  var total = resSum(list);
  if (total <= pay) { execReservations(list, list.map(function(r){ return r.amount; }), key); return total; }
  openResShort(key, jobId, pay);
  return -1;
}
function execReservations(list, amounts, key){
  var parts = [], sum = 0, jarFx = null;
  list.forEach(function(r, i){
    var a = Math.max(0, Math.round(amounts[i] || 0)), done = 0;
    if (a > 0 && r.t === 'e') {
      var md = state.months[r.eKey || curKey], ex = md && md.expenses.filter(function(x){ return x.id === r.tid; })[0];
      if (ex && !ex.paid) {
        done = Math.min(a, billDue(ex));
        ex.saved = (ex.saved || 0) + done;
        if (ex.debtId && state.debts.some(function(x){ return x.id === ex.debtId; })) {
          state.debtTx.push({ id: uid(), debtId: ex.debtId, date: todayStr(), amount: done, ref: 'rs:' + r.id });
          if (ex.saved >= ex.amount) ex.paid = true;
        }
      }
    } else if (a > 0 && r.t === 'd') {
      var d = state.debts.filter(function(x){ return x.id === r.tid; })[0];
      if (d) { done = Math.min(a, debtLeft(d)); if (done) { state.debtTx.push({ id: uid(), debtId: d.id, date: todayStr(), amount: done, ref: 'rs:' + r.id }); syncRataForDebt(d); } }
    } else if (a > 0 && r.t === 'j') {
      var j = jarById(r.tid);
      if (j) { done = Math.min(a, Math.max(0, j.target - jarSaved(j.id))); if (done) { if (!jarFx) { jarFx = { j: j, from: jarPlan(j).pct, amount: done }; coinHold['jar-' + j.id] = true; } state.jarTx.push({ id: uid(), jarId: j.id, date: todayStr(), amount: done, note: 'Rezervacija iz plate' }); } }
    }
    r.st = done > 0 ? 'done' : 'skip'; r.done = todayStr(); r.paid = done;
    if (done > 0) { sum += done; parts.push(r.name + ' ' + cf(done)); }
  });
  if (sum > 0) state.wallet.push({ id: uid(), date: todayStr(), amount: -sum, note: 'Iz plate: ' + parts.join(', '), kind: 'al', acc: 'bank' });
  save(); renderAll();
  if (sum > 0) {
    sfx('cash');
    if (jarFx) coinFx(jarFx.j, jarFx.from, jarPlan(jarFx.j).pct, 1, jarFx.amount);
    toast('Plata legla: automatski raspoređeno ' + rsd(sum) + ' sa računa · ' + parts.join(', '));
  }
  return sum;
}
function openResShort(key, jobId, pay){

  sheet = { mode: 'resshort', key: key, jobId: jobId, pay: pay, vals: vals };

    '<p class="q">Šta da skratim? Predlog: po redu, prvo računi i dug. Iznose menjaš ti.</p>' +

      return '<div class="bk-row"><div><b>' + esc(r.name) + '</b><small>rezervisano ' + rsd(r.amount) + '</small></div>' + moneyInput('data-rss="' + esc(r.id) + '"', vals[r.id], '0') + '</div>';
    }).join('') + '</div><div class="bk-sum" id="rssSum"></div>';
  $('#sheetFoot').innerHTML = '<button type="button" class="btn primary block" data-act="rss-ok">Rasporedi</button>' +
    '<button type="button" class="btn ghost block" data-act="rss-skip">Ne raspoređuj sada — ostavi rezervacije</button>';
  openSheet('Leglo manje nego što je rezervisano');
  updRssSum();
}
function updRssSum(){
  var el = $('#rssSum'); if (!el || !sheet || sheet.mode !== 'resshort') return;

  MILES.forEach(function(m){ if (s.n >= m && m > (cel.m || 0)) hit = m; });
  if (hit) {

    return;

var CATNAME = { kocka: 'Kladionica i kocka', cig: 'Cigarete', izlaz: 'Izlasci i piće', hrana: 'Dostava i brza hrana', igre: 'Igrice', sitno: 'Grickalice i energetska pića' };
function monthSummary(k){
  var md = monthFor(k), st = computeStats(md, k);
  var spent = st.spend + st.paidExp, saved = st.deposited, rate = st.earned > 0 ? saved / st.earned * 100 : 0;
  var pk = shiftKey(k, -1), pm = state.months[pk], ps = pm && monthHasData(pm) ? computeStats(pm, pk) : null;
  var g = {};
  Object.keys(md.days || {}).forEach(function(d){
    (md.days[d].spend || []).forEach(function(x){
      var h = impulseOf(x.note), nt = (x.note || '').trim().toLowerCase(), key = h ? 'c:' + h.c : 'n:' + nt;
      var gr = g[key] || (g[key] = { label: h ? CATNAME[h.c] : (nt ? cap(nt) : 'Bez opisa'), e: h ? h.e : '💸', sum: 0, cnt: 0, imp: !!h });
      gr.sum += x.amount; gr.cnt++;
    });
  });
  var leaks = Object.keys(g).map(function(x){ return g[x]; }).sort(function(a, b){ return b.sum - a.sum; }).slice(0, 3);
  var hist = [];
  for (var i = 0; i < 3; i++) {
    var hk = shiftKey(k, -i), hm2 = state.months[hk];
    if (hm2 && monthHasData(hm2)) {
      var hs = computeStats(hm2, hk);
      hist.push(hk === curKey && hs.projection !== null ? Math.max(hs.earned, hs.projection) : hs.earned);   // tekući mesec: procena do kraja
    }
  }
  var avg = hist.length ? hist.reduce(function(a, b){ return a + b; }, 0) / hist.length : 0;
  var tk = shiftKey(k, 1), tm = monthFor(tk), tExp = computeStats(tm, tk).expensesTotal;
  var goal = avg > 0 ? Math.ceil(Math.max(avg * 1.05, tExp) / 1000) * 1000 : 0;
  return { k: k, st: st, spent: spent, saved: saved, rate: rate, ps: ps, psSpent: ps ? ps.spend + ps.paidExp : 0, leaks: leaks,
    goal: goal, months: hist.length, tk: tk, tGoal: tm.goalMode === 'expenses' ? computeStats(tm, tk).expensesTotal : tm.goalManual, tMode: tm.goalMode };
}
function cmpBadge(cur, prev, goodUp){
  if (!prev) return '';
  var d = cur - prev, pct = Math.round(Math.abs(d) / prev * 100);
  if (!d || !pct) return '<span class="cmp same">isto kao prošli</span>';
  var good = goodUp ? d > 0 : d < 0;
  return '<span class="cmp ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + pct + '% od prošlog</span>';
}
function summaryHtml(k){
  var S = monthSummary(k), st = S.st, p = parseKey(k), tp = parseKey(S.tk), h = '';
  if (st.noData || (!st.hasData && st.cmp >= 0 && !st.earned && !st.spend)) return '<p class="empty" style="margin:0">Nema podataka za ' + MONTHS[p.m] + ' ' + p.y + '.</p>';
  h += '<div class="stats">' +
    stat(['Zarađeno', cf(st.earned) + ' <small>' + curLbl() + '</small>', cmpBadge(st.earned, S.ps && S.ps.earned, true) || 'dnevnice i bakšiš']) +
    stat(['Potrošeno', cf(S.spent) + ' <small>' + curLbl() + '</small>', cmpBadge(S.spent, S.psSpent, false) || 'potrošnja + plaćeni računi']) +
    stat(['Ušteđeno', cf(S.saved) + ' <small>' + curLbl() + '</small>', 'neto u kasice']) +
    stat(['Štednja', (st.earned > 0 ? Math.round(S.rate) : 0) + ' <small>%</small>', S.rate >= 20 ? 'odlično (cilj 10–20%)' : S.rate >= 10 ? 'dobro (cilj 10–20%)' : 'cilj je 10–20% zarade']) +
    '</div>';

  }
  h += '<div class="sum-h">3 najveća curenja</div>';
  if (S.leaks.length) {

      return '<div class="leak"><i aria-hidden="true">' + l.e + '</i><span>' + esc(l.label) + '<small>' + l.cnt + '× · ' + (S.spent > 0 ? Math.round(l.sum / S.spent * 100) : 0) + '% potrošnje</small></span><b class="num">' + rsd(l.sum) + '</b></div>';
    }).join('') + '</div>';

      (top && top.sum >= 1000 ? ' Ako „' + esc(top.label) + '“ prepoloviš, to je još <b>' + rsd(Math.round(top.sum / 2)) + '</b> za kasicu.' : '') +

function formatLive(el, ev){
  var raw = el.value, it = (ev && ev.inputType) || '', data = ev && ev.data;
  var pos = el.selectionStart == null ? raw.length : el.selectionStart;
  if (!/delete/i.test(it) && !(data && data.length === 1) && /^\s*\d+\.\d{1,2}\s*$/.test(raw)) raw = raw.replace('.', ',');
  if (fieldCur(el) === 'EUR' && raw.indexOf(',') < 0 && !/delete/i.test(it)) {
    var mm = /^(.*\d)\.(\d{0,2})$/.exec(raw.replace(/\s/g, ''));
    if (mm) raw = mm[1] + ',' + mm[2];
  }
  var p = splitAmt(raw);
  var f = (p.int || p.dec !== null) ? fmt(p.int ? parseInt(p.int, 10) : 0) : '';
  if (p.dec !== null) f += ',' + p.dec;
  el.value = f;
  var comma = f.indexOf(','), c = 0;
  if (p.sep >= 0 && pos > p.sep) c = comma + 1 + Math.min(p.dec.length, raw.slice(p.sep + 1, pos).replace(/\D/g, '').length);
  else {
    var want = raw.slice(0, pos).replace(/\D/g, '').length, k = 0;
    while (c < f.length && k < want) { if (/\d/.test(f[c])) k++; c++; }
    if (comma >= 0 && c > comma) c = comma;
  }
  if (document.activeElement === el) { try { el.setSelectionRange(c, c); } catch (e) {} }
}

/* ================== Sinhronizacija preko Supabase-a (bez biblioteka) ==================

function saveSync(){

    if (f && f.uid && sync.uid && f.uid === sync.uid && f.rt && f.rt !== sync.rt && (f.exp || 0) > (sync.exp || 0)) {
      sync.at = f.at; sync.rt = f.rt; sync.exp = f.exp;

}

  return fetch(SB_URL + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store' })
    .then(function(res){ return res.text().then(function(t){ var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {} return { ok: res.ok, status: res.status, data: j }; }); });
}

  if (/already registered|already exists/i.test(m)) return 'Nalog sa ovim emailom već postoji — prijavi se.';

function fetchJson(url, ms){
  return new Promise(function(res, rej){
    var done = false;
    var to = setTimeout(function(){ if (!done) { done = true; rej(new Error('timeout')); } }, ms || 8000);
    fetch(url, { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
      if (!done) { done = true; clearTimeout(to); res(j); }
    }, function(e){ if (!done) { done = true; clearTimeout(to); rej(e); } });
  });
}
function refreshRate(force){

/* ================== Niz dana i dostignuća ================== */
var memoC = {};
function memo(name, fn){
  var k = dataVer + '|' + todayStr(), c = memoC[name];
  if (c && c.k === k) return c.v;
  var v = fn(); memoC[name] = { k: k, v: v }; return v;
}
/* Da li je na dati radni dan ispunjen dnevni cilj (isto pravilo kao „Danas“ na početnoj) */
function dayHit(key, md, d){
  var r = md.days[d];
  if (!isWork(r)) return null;
  var p = parseKey(key), n = dim(p.y, p.m);
  var goal = md.goalMode === 'expenses' ? md.expenses.reduce(function(s, e){ return s + (e.amount || 0); }, 0) : (md.goalManual || 0);
  var earned = sumDay(r);
  if (goal <= 0) return earned > 0;
  var before = 0;
  for (var i = 1; i < d; i++) before += sumDay(md.days[i]);
  var remStart = Math.max(0, goal - before), days = n - d + 1;
  var target = remStart > 0 ? Math.ceil(remStart / days - 1e-9) : 0;
  return target === 0 ? true : earned >= target;
}
function streakInfo(){
  return memo('streak', function(){
    var list = [];
    Object.keys(state.months).sort().forEach(function(k){
      var md = state.months[k];
      Object.keys(md.days).map(Number).sort(function(a, b){ return a - b; }).forEach(function(d){
        var h = dayHit(k, md, d);
        if (h !== null) list.push(h);
      });
    });
    var best = 0, run = 0;
    list.forEach(function(h){ if (h) { run++; if (run > best) best = run; } else run = 0; });
    return { cur: run, best: best, days: list.length };
  });
}
function achStats(){
  return memo('ach', function(){
    var a = { work: 0, bestMonth: 0, goalHits: 0, bestDay: 0, neat: 0, saved: totalSaved() };
    Object.keys(state.months).forEach(function(k){
      var md = state.months[k], st = computeStats(md, k);
      a.work += st.workDays;
      if (st.earned > a.bestMonth) a.bestMonth = st.earned;
      if (st.goal > 0 && st.earned >= st.goal) a.goalHits++;
      if (st.cmp < 0 && st.missing.length === 0 && st.recorded >= 20) a.neat++;
      Object.keys(md.days).forEach(function(d){ var s = sumDay(md.days[d]); if (s > a.bestDay) a.bestDay = s; });
    });
    return a;
  });
}

function forecastInfo(){
  var md = monthFor(curKey), st = computeStats(md, curKey), mj = mainJob();
  if (st.remainingDays <= 0) return null;
  var perDay = st.workDays > 0 ? st.earned / st.workDays : (mj ? mj.rate : 0);
  if (!(perDay > 0)) return null;
  var wr = workRate(), rem = st.remainingDays;
  return { st: st, perDay: perDay, wr: wr, rem: rem,
    exp: Math.round(st.earned + perDay * rem * wr),
    lo: Math.round(st.earned + perDay * rem * Math.max(0, wr - 0.15)),
    hi: Math.round(st.earned + perDay * rem * Math.min(1, wr + 0.15)) };
}

function dueItems(){
  var md = state.months[curKey]; if (!md) return [];
  var st = computeStats(md, curKey), out = [];
  md.expenses.forEach(function(e){
    var left = (e.amount || 0) - (e.saved || 0);
    if (e.paid || !e.due || left <= 0) return;
    var diff = Math.min(e.due, st.n) - T.d;
    if (diff <= 7) out.push({ e: e, diff: diff, left: left });
  });
  return out.sort(function(a, b){ return a.diff - b.diff; });
}
function dueLabel(diff){ return diff < 0 ? 'kasni ' + dana(-diff) : diff === 0 ? 'rok je danas' : diff === 1 ? 'rok je sutra' : 'rok za ' + dana(diff); }
function renderDue(){

function toggleExpPaid(key, id){
  var md = ensureMonth(key);

  var ref = key + ':' + ex.id;
  if (ex.debtId && state.debts.some(function(x){ return x.id === ex.debtId; })) {
    state.debtTx = state.debtTx.filter(function(x){ return x.ref !== ref; });
    if (ex.paid && ex.amount - (ex.saved || 0) > 0) state.debtTx.push({ id: uid(), debtId: ex.debtId, date: todayStr(), amount: ex.amount - (ex.saved || 0), ref: ref });
  }
  save(); renderAll();
  if (ex.paid) {
    sfx('out');
    var cb = byAttr($('#expCard'), 'data-id', id);
    if (cb && !reduced()) cb.classList.add('pop');

}

function limitInfo(){
  var s = state.settings, md = monthFor(curKey), st = computeStats(md, curKey);
  return { ld: s.limitDay || 0, lm: s.limitMonth || 0, td: spendDay(md.days[T.d]), tm: st.spend };
}
function limitNote(){
  var L = limitInfo(), parts = [];
  if (L.ld && L.td > L.ld) parts.push('iznad dnevnog limita za ' + rsd(L.td - L.ld));
  else if (L.ld && L.td >= L.ld * 0.8) parts.push('dnevni limit: ostalo ' + rsd(L.ld - L.td));
  if (L.lm && L.tm > L.lm) parts.push('iznad mesečnog limita');
  else if (L.lm && L.tm >= L.lm * 0.8) parts.push('mesečni limit: ostalo ' + rsd(L.lm - L.tm));
  return parts.join(' · ');
}
function limitHtml(){
  var L = limitInfo(), out = [];
  if (L.ld) out.push('<p>Danas: <b>' + rsd(L.td) + '</b> od limita ' + rsd(L.ld) + (L.td < L.ld ? ' · ostalo <b>' + rsd(L.ld - L.td) + '</b>' : ' · <span class="neg">iznad limita</span>') + '</p>');
  if (L.lm) out.push('<p>Ovaj mesec: <b>' + rsd(L.tm) + '</b> od limita ' + rsd(L.lm) + (L.tm < L.lm ? ' · ostalo <b>' + rsd(L.lm - L.tm) + '</b>' : ' · <span class="neg">iznad limita</span>') + '</p>');
  return out.join('');
}

function downloadFile(text, name, mime, msg){
  function plain(){
    try {
      var blob = new Blob([text], { type: mime });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      toast(msg);
    } catch (e) { toast('Fajl nije uspeo na ovom uređaju.'); }
  }
  try {
    var file = new File([text], name, { type: mime });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function(err){ if (!err || err.name !== 'AbortError') plain(); });
      return;
    }
  } catch (e) {}
  plain();
}
function addCalReminder(){
  var tm = (ui.remindTime || '23:00').split(':'), now = new Date();
  function p2(n){ return String(n).padStart(2, '0'); }
  var d0 = now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate());
  var stamp = now.getUTCFullYear() + p2(now.getUTCMonth() + 1) + p2(now.getUTCDate()) + 'T' + p2(now.getUTCHours()) + p2(now.getUTCMinutes()) + '00Z';
  var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mesecna zarada//SR', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:zarada-podsetnik-' + d0 + '@local', 'DTSTAMP:' + stamp, 'DTSTART:' + d0 + 'T' + tm[0] + tm[1] + '00', 'DURATION:PT10M', 'RRULE:FREQ=DAILY',
    'SUMMARY:Upiši današnju zaradu', 'DESCRIPTION:Otvori aplikaciju Zarada i upiši dnevnicu\\, bakšiš i potrošnju.',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Upiši današnju zaradu', 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  downloadFile(ics, 'zarada-podsetnik.ics', 'text/calendar', 'Podsetnik je spreman. Otvori fajl i dodaj ga u Kalendar.');
}
