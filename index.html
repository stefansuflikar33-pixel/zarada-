/* ---------- Grafikoni ---------- */
function renderWeek(){
  var t = todayStr(), back = (pd(t).getDay() + 6) % 7, start = addDaysStr(t, -back), end = addDaysStr(start, 6);
  var earned = 0, spent = 0, saved = 0, work = 0;
  for (var i = 0; i < 7; i++) {
    var s = addDaysStr(start, i), r = recAt(s);
    earned += sumDay(r); spent += spendDay(r); if (isWork(r)) work++;
  }
  state.jarTx.forEach(function(x){ if (x.amount > 0 && x.date >= start && x.date <= end) saved += x.amount; });
  var a = pd(start), b = pd(end);
  var range = a.getMonth() === b.getMonth() ? a.getDate() + '.–' + b.getDate() + '. ' + MONTHS[b.getMonth()] : a.getDate() + '. ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + '. ' + MONTHS[b.getMonth()];
  var msg;
  if (!work && !spent && !saved) msg = 'Ove nedelje još nema upisa.';
  else {
    msg = radnih(work) + ' ove nedelje.';
    if (earned > 0 && saved <= earned && spent <= earned) msg += ' Od zarade si odvojio ' + Math.round(saved / earned * 100) + '%, a potrošio ' + Math.round(spent / earned * 100) + '%.';
    else if (earned > 0 && saved > earned) msg += ' Odvojio si više nego što si zaradio — odlično.';
  }
  setHTML($('#weekCard'), '<div class="card-h"><h2>' + hic('cal', 'b') + 'Ova nedelja</h2><span class="hint" style="margin:0">' + range + '</span></div>' +
    '<div class="week num"><div><div class="k">Zarađeno</div><div class="v">' + countSpan('wk-e', earned) + '</div></div>' +
    '<div><div class="k">Potrošeno</div><div class="v">' + countSpan('wk-s', spent) + '</div></div>' +
    '<div><div class="k">Odvojeno</div><div class="v">' + countSpan('wk-o', saved) + '</div></div></div>' +
    '<p class="week-msg">' + msg + '</p>');
}
function renderCharts(){
  // Bakšiš po danima u nedelji (poslednjih 90 dana)
  var sum = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0], t = todayStr();
  for (var i = 0; i < 90; i++) {
    var s = addDaysStr(t, -i), r = recAt(s);
    if (isWork(r)) { var w = (pd(s).getDay() + 6) % 7; sum[w] += tipDay(r); cnt[w]++; }
  }
  var avg = sum.map(function(x, i){ return cnt[i] ? x / cnt[i] : 0; });
  var max = Math.max.apply(null, avg), best = avg.indexOf(max);
  var h = '<h3>' + hic('cash', 'a') + 'Bakšiš po danima u nedelji</h3>';
  if (max > 0) {
    h += '<p class="cap">Prosek po radnom danu, poslednjih 90 dana. Najviše: <b>' + cap(DAYS[(best + 1) % 7]) + '</b> (' + rsd(max) + ').</p><div class="bars">';
    avg.forEach(function(v, i){
      var hp = max ? Math.max(2, v / max * 100) : 0;
      h += '<div class="b' + (i === best ? ' top' : '') + '" style="--d:' + (i * 55) + 'ms" title="' + WD[i] + ': ' + rsd(v) + '"><em style="bottom:calc(' + hp + '% + 4px)">' + (cnt[i] ? short(v) : '') + '</em><i style="height:' + (cnt[i] ? hp : 0) + '%"></i></div>';

  // Potrošnja kroz mesec

  var mx = Math.max.apply(null, vals), isCur = viewKey === curKey, daysSoFar = isCur ? T.d : n;

    h += '<p class="cap">Ukupno <b>' + rsd(tot) + '</b> · prosečno ' + rsd(tot / daysSoFar) + ' po danu.</p><div class="bars thin">';
    vals.forEach(function(v, i){
      var hp = Math.max(v ? 2 : 0, v / mx * 100);
      h += '<div class="b' + (isCur && i + 1 === T.d ? ' today' : '') + '" style="--d:' + (i * 18) + 'ms" title="' + (i + 1) + '. ' + MONTHS[p.m] + ': ' + rsd(v) + '"><i style="height:' + hp + '%"></i></div>';
    });

    h += '</div>';
  } else h += '<p class="cap">Još nema upisane potrošnje za ovaj mesec. Dodaje se preko „Potrošio sam“, dugmetom + ili dodirom na dan.</p>';
  setHTML($('#chartSpend'), h);

  // Bakšiš kroz mesec
  var tv = [], ttot = 0, tdays = 0;
  for (d = 1; d <= n; d++) { var rr = md.days[d], tp = tipDay(rr); tv.push(tp); ttot += tp; if (isWork(rr)) tdays++; }
  var tmx = Math.max.apply(null, tv), tbest = tv.indexOf(tmx);
  h = '<h3>' + hic('cash', 'a') + 'Bakšiš kroz ' + MONTHS[p.m] + '</h3>';
  if (tmx > 0) {
    h += '<p class="cap">Ukupno <b>' + rsd(ttot) + '</b> · prosečno ' + rsd(tdays ? ttot / tdays : 0) + ' po radnom danu. Najviše: <b>' + (tbest + 1) + '. ' + MONTHS[p.m] + '</b> (' + rsd(tmx) + ').</p><div class="bars thin tp">';
    tv.forEach(function(v, i){
      var hp = Math.max(v ? 2 : 0, v / tmx * 100);
      h += '<div class="b' + (i === tbest ? ' top' : '') + '" style="--d:' + (i * 18) + 'ms" title="' + (i + 1) + '. ' + MONTHS[p.m] + ': ' + rsd(v) + '"><i style="height:' + hp + '%"></i></div>';
    });
    h += '</div><div class="xlab thin">';
    for (d = 1; d <= n; d++) h += '<span>' + (d === 1 || d % 5 === 0 ? d : '') + '</span>';
    h += '</div>';
  } else h += '<p class="cap">Pojaviće se kad u ovom mesecu upišeš dane sa bakšišem.</p>';
  setHTML($('#chartTipsMonth'), h);

  // Potrošnja po nedeljama (pon–ned, unutar meseca)
  var weeks = [], wk = null;
  for (d = 1; d <= n; d++) {

  var wmx = Math.max.apply(null, weeks.map(function(w){ return w.sum; })), wbest = -1;

  } else h += '<p class="cap">Još nema upisane potrošnje za ovaj mesec.</p>';
  setHTML($('#chartWeeks'), h);
}

function switchTab(name){
  if (name === tab) { window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); return; }

function deposit(jarId, amount, note, noWallet){
  var j = jarById(jarId); if (!j) return;
  var before = jarPlan(j).pct;
  state.jarTx.push({ id: uid(), jarId: jarId, date: todayStr(), amount: amount, note: note || '' });
  if (!noWallet) state.wallet.push({ id: uid(), date: todayStr(), amount: -amount, note: 'U kasicu „' + j.name + '“', kind: 'jar' });
  coinHold['jar-' + j.id] = true;
  save(); renderAll();
  sfx('cash');
  var p = jarPlan(j), mile = 0;
  [25, 50, 75, 100].forEach(function(th){ if (before < th && p.pct >= th) mile = th; });
  coinFx(j, before, p.pct, 1, amount);
  if (mile === 100) { confetti(); sfx('win'); toast('Kasica „' + j.name + '“ je puna! ' + rsd(p.saved) + ' ušteđeno.'); }
  else if (mile) { confetti(); sfx('win'); toast((mile === 50 ? 'Pola puta' : mile + '% puta') + ' do „' + j.name + '“! Još ' + rsd(p.need) + '.'); }
  else toast('Ubačeno ' + rsd(amount) + ' · ' + j.name + ' ' + Math.floor(p.pct) + '% · još ' + rsd(p.need));
}
function withdraw(jarId, amount, note){
  var j = jarById(jarId); if (!j) return;
  amount = Math.min(amount, jarSaved(jarId));
  if (!amount) return;
  var before = jarPlan(j).pct;
  state.jarTx.push({ id: uid(), jarId: jarId, date: todayStr(), amount: -amount, note: note || '' });
  state.wallet.push({ id: uid(), date: todayStr(), amount: amount, note: 'Iz kasice „' + j.name + '“', kind: 'jar' });
  coinHold['jar-' + j.id] = true;
  save(); renderAll(); sfx('out');
  coinFx(j, before, jarPlan(j).pct, -1, amount);
  toast('Izvađeno ' + rsd(amount) + ' iz „' + j.name + '“');
}
function syncRataForDebt(d){
  var cm = ensureMonth(curKey);
  var ex = cm.expenses.filter(function(e){ return e.debtId === d.id; })[0];
  if (ex) {
    if (!ex.paid) {
      var saved = ex.saved || 0, left = debtLeft(d), amt = Math.min(d.monthly, left + saved);
      ex.name = 'Rata: ' + d.name; ex.due = d.dueDay;
      if (saved > 0 && (left <= 0 || saved >= amt)) { ex.amount = saved; ex.paid = true; }
      else if (!d.monthly || left <= 0) cm.expenses = cm.expenses.filter(function(e){ return e !== ex; });
      else ex.amount = amt;
    }
  } else if (d.monthly > 0 && debtLeft(d) > 0) cm.expenses.push(rataExpense(d));
}

var toastTimer = null;
function toast(msg, actLabel, actFn){
  var el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (actLabel ? '<button type="button">' + esc(actLabel) + '</button>' : '');
  el.classList.toggle('act', !!actLabel);
  if (actLabel) el.querySelector('button').onclick = function(){ actFn(); hideToast(); };
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actLabel ? 6000 : 3000);
}

/* ================== Unos iznosa (1.000 format dok kucaš) ================== */
function formatLive(el, ev){
  var raw = el.value, it = (ev && ev.inputType) || '', data = ev && ev.data;
  var pos = el.selectionStart == null ? raw.length : el.selectionStart;
  if (!/delete/i.test(it) && !(data && data.length === 1) && /^\s*\d+\.\d{1,2}\s*$/.test(raw)) raw = raw.replace('.', ',');
  var p = splitAmt(raw);
  var f = (p.int || p.dec !== null) ? fmt(p.int ? parseInt(p.int, 10) : 0) : '';
  if (p.dec !== null) f += ',' + p.dec;
  el.value = f;
  var comma = f.indexOf(','), c = 0;
  if (p.sep >= 0 && pos > p.sep) c = comma + 1 + Math.min(p.dec.length, raw.slice(p.sep + 1, pos).replace(/\D/g, '').length);
  else {
    var want = raw.slice(0, pos).replace(/\D/g, '').length, k = 0;
    while (c < f.length && k < want) { if (/\d/.test(f[c])) k++; c++; }
    if (comma >= 0 && c > comma) c = comma;
  }
  if (document.activeElement === el) { try { el.setSelectionRange(c, c); } catch (e) {} }
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { if (bankerOpen()) closeBanker(); else if (sheet || sheetIsOpen()) closeSheet(); else if (setOpen) closeSettings(); return; }
  if (bankerOpen()) return;
  if (e.key !== 'Enter' || !sheet) return;
  var id = e.target.id;
  if (sheet.mode === 'day' && (id === 'spendAmt' || id === 'spendNote')) { e.preventDefault(); addSpend(); return; }
  if (sheet.mode === 'stash' && id === 'stOwn') { e.preventDefault(); var so2 = document.querySelector('[data-act="st-ok"]'); if (so2 && !so2.disabled) so2.click(); return; }
  if (sheet.mode === 'amount' && (id === 'amtInput' || id === 'amtNote')) { e.preventDefault(); var ok = document.querySelector('[data-act="amt-ok"]'); if (ok) ok.click(); return; }
  if ((sheet.mode === 'exp' || sheet.mode === 'jar' || sheet.mode === 'debt') && e.target.tagName === 'INPUT' && e.target.type !== 'date') {
    e.preventDefault(); var pb = $('#sheetFoot .btn.primary'); if (pb) pb.click(); return;
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('amt-in') && !e.target.form && !sheet) e.target.blur();
});

/* Prevlačenje levo/desno po kalendaru menja mesec */
(function(){
  var g = $('#calGrid'), x0 = null, y0 = 0, t0 = 0;
  g.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
  g.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 45 && Date.now() - t0 < 650) changeMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* ================== Sinhronizacija preko Supabase-a (bez biblioteka) ================== */
function saveSync(){ try { localStorage.setItem(SYNCKEY, JSON.stringify(sync)); } catch (e) {} }
function loggedIn(){ return !!(sync && sync.at && sync.rt && sync.uid); }
function hm(ms){ var d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function markDirty(){ if (!loggedIn()) return; sync.dirty = true; sync.localAt = new Date().toISOString(); saveSync(); scheduleSync(1200); }
function scheduleSync(ms){ if (!loggedIn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(function(){ doSync(); }, ms || 0); }
function sbFetch(path, opt, auth){
  opt = opt || {};
  var h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  if (auth) h.Authorization = 'Bearer ' + sync.at;
  if (opt.headers) Object.keys(opt.headers).forEach(function(k){ h[k] = opt.headers[k]; });
  return fetch(SB_URL + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined })
    .then(function(res){ return res.text().then(function(t){ var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {} return { ok: res.ok, status: res.status, data: j }; }); });
}
function sbErr(res){
  var d = (res && res.data) || {}, m = String(d.msg || d.message || d.error_description || d.error || '');
  if (/invalid login credentials/i.test(m)) return 'Pogrešan email ili lozinka.';
  if (/not confirmed/i.test(m)) return 'Email još nije potvrđen — otvori poruku od Supabase-a, klikni link, pa se prijavi ovde.';
  if (/already registered|already exists/i.test(m)) return 'Nalog sa ovim emailom već postoji — prijavi se.';
  if (/password/i.test(m)) return 'Lozinka nije prihvaćena (najmanje 6 znakova).';
  if (d.code === 'PGRST205' || (/app_state/.test(m) && /find|exist/i.test(m))) return 'Tabela „app_state“ ne postoji — pokreni SQL u Supabase-u (SQL Editor → Run).';
  if (/row-level security|permission/i.test(m)) return 'Server je odbio upis — proveri da je ceo SQL pokrenut (pravila pristupa).';
  if (/rate limit/i.test(m)) return 'Previše pokušaja — sačekaj minut pa probaj ponovo.';
  return m || ('Greška servera' + (res && res.status ? ' (' + res.status + ')' : '') + '.');
}
function setSession(d, email){
  sync.at = d.access_token; sync.rt = d.refresh_token; sync.exp = Date.now() + (d.expires_in || 3600) * 1000;
  if (d.user) { sync.uid = d.user.id; sync.email = d.user.email || email; }
  saveSync();
}
function ensureToken(){
  if (!loggedIn()) return Promise.reject({ data: { msg: 'Nisi prijavljen.' } });
  if (Date.now() < (sync.exp || 0) - 60000) return Promise.resolve();
  return sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: sync.rt } }).then(function(res){
    if (!res.ok) { if (res.status === 400 || res.status === 401) logoutLocal('Prijava je istekla — prijavi se ponovo.'); throw res; }
    setSession(res.data);
  });
}
function setSyncStatus(s, m){
  var wasErr = syncStatus === 'err';
  syncStatus = s; syncMsg = m || '';
  renderSyncUi();
  if (ready && wasErr !== (s === 'err')) { renderHome(); afterRender(); }
}
function hasLocalData(){
  return !!(state.jobs.length || state.jarTx.length || state.wallet.length || state.debts.length ||
    Object.keys(state.months).some(function(k){ return Object.keys(state.months[k].days).length > 0; }));
}
function applyRemote(data){
  applyingRemote = true;
  try { state = normalize(data); virt = {}; ensureMonth(curKey); ensureWalletFrom(); save(); }
  finally { applyingRemote = false; }
  renderAll();
}
function pull(row){ applyRemote(row.data); sync.remoteAt = row.updated_at; sync.dirty = false; saveSync(); }
function push(){
  var now = new Date().toISOString(), stamp = sync.localAt;
  return sbFetch('/rest/v1/app_state?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
    body: { user_id: sync.uid, data: state, updated_at: now } }, true).then(function(res){
    if (res.status === 401) { sync.exp = 0; throw { retry: true }; }
    if (!res.ok) throw res;
    var row = res.data && res.data[0];
    sync.remoteAt = row && row.updated_at ? row.updated_at : now;
    if (sync.localAt === stamp) sync.dirty = false; else syncAgain = true;
    saveSync();
  });
}
function firstChoice(row){
  if (!hasLocalData()) return pull(row);
  pendingRow = row;
  sheet = { mode: 'syncchoice' };
  var d = new Date(row.updated_at);
  $('#sheetBody').innerHTML = '<p class="confirm-t">Na serveru već postoje podaci (poslednja izmena ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + ' u ' + hm(d.getTime()) + '), a i na ovom uređaju ima upisanih podataka.</p>' +
    '<p class="confirm-t">Koje da zadržim? Drugi će biti zamenjeni. Zadrži podatke sa uređaja na kom si najviše upisivao — ako nisi siguran, prvo sačuvaj rezervnu kopiju.</p>';
  $('#sheetFoot').innerHTML = '<button type="button" class="btn primary block" data-act="sync-remote">Zadrži podatke sa servera</button>' +
    '<button type="button" class="btn block" data-act="sync-local">Zadrži podatke sa ovog uređaja</button>';
  openSheet('Koje podatke da zadržim?');
  throw { choice: true };
}
function doSync(opts){
  opts = opts || {};
  if (!loggedIn()) { if (syncStatus !== 'off') setSyncStatus('off'); return; }
  if (syncBusy) { syncAgain = true; return; }
  if (sheet && !opts.force) { scheduleSync(5000); return; }
  if (navigator.onLine === false) { setSyncStatus('offline'); return; }
  syncBusy = true; setSyncStatus('busy');
  ensureToken().then(function(){
    return sbFetch('/rest/v1/app_state?select=data,updated_at&user_id=eq.' + encodeURIComponent(sync.uid), {}, true);
  }).then(function(res){
    if (res.status === 401) { sync.exp = 0; throw { retry: true }; }
    if (!res.ok) throw res;
    var row = res.data && res.data[0];
    if (!row) { sync.dirty = true; return push(); }
    if (sync.remoteAt == null) return firstChoice(row);
    if (row.updated_at === sync.remoteAt) return sync.dirty ? push() : null;
    if (!sync.dirty || Date.parse(row.updated_at) > (sync.localAt ? Date.parse(sync.localAt) : 0)) return pull(row);
    return push();
  }).then(function(){
    syncBusy = false; sync.lastOk = Date.now(); saveSync(); setSyncStatus('ok');
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }, function(err){
    syncBusy = false;
    if (err && err.retry && !opts.retried) { doSync({ retried: true, force: opts.force }); return; }
    if (err && err.choice) { setSyncStatus('wait'); return; }
    if (!loggedIn()) return;
    var offline = err instanceof TypeError || navigator.onLine === false;
    setSyncStatus(offline ? 'offline' : 'err', offline ? '' : sbErr(err));
  });
}
function sbAuth(signup){
  var em = (($('#sbEmail') || {}).value || '').trim(), pw = ($('#sbPass') || {}).value || '';
  if (!/^\S+@\S+\.\S+$/.test(em)) { authMsg = 'Upiši ispravan email.'; authOk = false; renderSyncUi(); return; }
  if (pw.length < 6) { authMsg = 'Lozinka mora imati najmanje 6 znakova.'; authOk = false; renderSyncUi(); return; }
  authMsg = signup ? 'Pravim nalog…' : 'Prijavljujem…'; authOk = true; renderSyncUi();
  sbFetch(signup ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', { method: 'POST', body: { email: em, password: pw } }).then(function(res){
    if (!res.ok) throw res;
    var d = res.data && res.data.access_token ? res.data : (res.data && res.data.session);
    if (!d || !d.access_token) { authMsg = 'Nalog je napravljen. Otvori email od Supabase-a i klikni link za potvrdu, pa se ovde prijavi.'; authOk = true; renderSyncUi(); return; }
    setSession(d, em); if (!sync.email) sync.email = em;
    sync.remoteAt = null; sync.dirty = false; sync.lastOk = 0; saveSync();
    authMsg = ''; renderSyncUi(); toast('Prijavljen: ' + sync.email);
    doSync({ force: true });
  }).catch(function(err){
    authOk = false;
    authMsg = err instanceof TypeError ? 'Nema veze sa serverom. Proveri internet.' : sbErr(err);
    renderSyncUi();
  });
}
function logoutLocal(msg){ sync = { email: sync.email }; saveSync(); authMsg = msg || ''; authOk = false; setSyncStatus('off'); }
function sbLogout(){
  var at = sync.at;
  if (at) fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + at } }).catch(function(){});
  clearTimeout(syncTimer); logoutLocal('');
}
function renderSyncUi(){
  var li = loggedIn(), dc = li ? ({ ok: 'ok', busy: 'busy', offline: 'off', err: 'err', wait: 'err' }[syncStatus] || 'off') : 'none';
  var dot = $('#cloudDot'); if (dot) dot.className = 'sd ' + dc;
  var box = $('#syncBox'); if (!box) return;
  var h = '<div class="sec-t">Sinhronizacija — telefon i Mac</div><section class="card">';
  if (li) {
    var t = syncStatus === 'busy' ? 'Sinhronizujem…' : syncStatus === 'ok' ? 'Sinhronizovano' + (sync.lastOk ? ' u ' + hm(sync.lastOk) : '') + '.' :
      syncStatus === 'offline' ? 'Nema interneta — sinhronizujem čim se veza vrati.' : syncStatus === 'wait' ? 'Čeka tvoj izbor koje podatke da zadržim.' :
      syncStatus === 'err' ? syncMsg : 'Spremno.';
    h += '<div class="set-row"><div><div class="t">Prijavljen</div><div class="d">' + esc(sync.email || '') + '</div></div>' +
      '<span style="position:relative;width:22px;height:22px"><i class="sd ' + dc + '" style="right:5px;top:5px;width:12px;height:12px"></i></span></div>' +
      '<p class="sync-st' + (syncStatus === 'err' ? ' neg' : syncStatus === 'ok' ? ' ok' : '') + '">' + esc(t) + '</p>' +
      '<div class="two" style="margin-top:12px"><button type="button" class="btn primary" data-act="sb-sync">Sinhronizuj sada</button><button type="button" class="btn" data-act="sb-logout">Odjavi se</button></div>' +
      '<p class="hint">Isti nalog na telefonu i Mac-u = isti podaci. Aplikacija radi i bez interneta, a izmene šalje sama kad se veza vrati.</p>';
  } else {
    h += '<div class="t" style="font-weight:700">Isti podaci na telefonu i Mac-u</div>' +
      '<div class="d" style="font-size:13.5px;color:var(--muted);margin-top:2px">Prijavi se istim nalogom na oba uređaja. Prvi put klikni „Napravi nalog“.</div>' +
      '<form data-form="sb" autocomplete="on" style="margin-top:14px">' +
        '<div class="field"><label class="lbl" for="sbEmail">Email</label><input class="inp" id="sbEmail" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="ime@primer.com"></div>' +
        '<div class="field"><label class="lbl" for="sbPass">Lozinka</label><input class="inp" id="sbPass" name="password" type="password" autocomplete="current-password" placeholder="najmanje 6 znakova"></div>' +
        '<div class="two"><button type="submit" class="btn primary">Prijavi se</button><button type="button" class="btn" data-act="sb-signup">Napravi nalog</button></div>' +
      '</form>' +
      (authMsg ? '<p class="sync-st ' + (authOk ? 'ok' : 'neg') + '">' + esc(authMsg) + '</p>' : '') +
      '<p class="hint">Podaci se tada čuvaju i na serveru (Supabase), zaštićeni tvojom prijavom. Bez prijave sve ostaje samo na ovom uređaju.</p>';
  }
  h += '</section>';
  var e1 = $('#sbEmail'), p1 = $('#sbPass'), ev = e1 ? e1.value : '', pv = p1 ? p1.value : '';
  if (setHTML(box, h)) { var e2 = $('#sbEmail'), p2 = $('#sbPass'); if (e2 && ev) e2.value = ev; if (p2 && pv) p2.value = pv; }
}

/* ================== Rezervna kopija ================== */
function downloadJson(json, name){
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('Rezervna kopija je sačuvana.');
  } catch (e) { toast('Kopija nije uspela na ovom uređaju.'); }
}
function exportData(){
  var json = JSON.stringify(state, null, 2), name = 'zarada-kopija-' + todayStr() + '.json';
  try {
    var file = new File([json], name, { type: 'application/json' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Rezervna kopija — Mesečna zarada' })
        .then(function(){ toast('Rezervna kopija je sačuvana.'); })
        .catch(function(err){ if (!err || err.name !== 'AbortError') downloadJson(json, name); });
      return;
    }
  } catch (e) {}
  downloadJson(json, name);
}
function importFile(file){
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    var data;
    try {
      data = JSON.parse(rd.result);
      if (!data || typeof data !== 'object' || !data.months) throw new Error('format');
    } catch (e) { toast('Ovo nije ispravan fajl sa kopijom.'); return; }
    askConfirm({ title: 'Vratiti kopiju?', danger: true, ok: 'Vrati kopiju',
      text: 'Vraćanje kopije <b>zamenjuje sve trenutne podatke</b> na ovom uređaju. Nastaviti?',
      onOk: function(){
        state = normalize(data); virt = {};
        ensureMonth(curKey); ensureWalletFrom(); save(); viewKey = curKey; closeSheet(); renderAll();
        toast('Podaci su vraćeni iz kopije.');
      } });
  };
  rd.readAsText(file);
}

/* ================== Prelazak dana / meseca dok je aplikacija otvorena ================== */
function tick(){
  var nT = nowParts();
  if (nT.y === T.y && nT.m === T.m && nT.d === T.d) return;
  var oldCur = curKey;
  T = nT; curKey = mkey(T.y, T.m); virt = {};
  if (viewKey === oldCur || viewKey > curKey) viewKey = curKey;
  ensureMonth(curKey); save();
  if (!sheet) renderAll();
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); if (loggedIn()) doSync(); } });
window.addEventListener('online', function(){ if (loggedIn()) doSync(); });
setInterval(function(){ tick(); if (loggedIn() && !document.hidden) doSync(); }, 60000);

/* ================== Ikonica za početni ekran ================== */
function setupIcon(){
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var g = c.getContext('2d');
    var rr = function(x, y, w, h, rad){ g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); };
    var bg = g.createLinearGradient(0, 0, 180, 180); bg.addColorStop(0, '#22c55e'); bg.addColorStop(1, '#15803d');
    g.fillStyle = bg; g.fillRect(0, 0, 180, 180);
    rr(40, 56, 100, 104, 28); g.fillStyle = 'rgba(255,255,255,.2)'; g.fill();
    g.save(); rr(40, 56, 100, 104, 28); g.clip();
    g.fillStyle = '#c98a00'; g.fillRect(40, 98, 100, 70);
    for (var row = 0; row < 8; row++) for (var col = -1; col < 7; col++) {
      g.beginPath(); g.ellipse(40 + col * 18 + (row % 2 ? 9 : 0), 100 + row * 8, 9, 4, 0, 0, 6.283);
      g.fillStyle = row % 2 ? '#facc15' : '#fde047'; g.fill(); g.strokeStyle = '#a16207'; g.lineWidth = 1.2; g.stroke();
    }
    g.restore();
    rr(40, 56, 100, 104, 28); g.strokeStyle = '#ffffff'; g.lineWidth = 7; g.stroke();
    rr(52, 70, 9, 50, 4.5); g.fillStyle = 'rgba(255,255,255,.55)'; g.fill();
    rr(58, 44, 64, 16, 5); g.fillStyle = '#ffffff'; g.fill();
    rr(50, 26, 80, 22, 8); g.fillStyle = '#ffffff'; g.fill();
    rr(74, 33, 32, 7, 3.5); g.fillStyle = '#15803d'; g.fill();
    var url = c.toDataURL('image/png');
    ['icon', 'apple-touch-icon'].forEach(function(rel){
      var l = document.createElement('link'); l.rel = rel; l.href = url; document.head.appendChild(l);
    });
    if (/^https?:$/.test(location.protocol)) {
      var man = { name: 'Mesečna zarada', short_name: 'Zarada', start_url: location.href.split('#')[0], display: 'standalone',
        background_color: '#f2f3f5', theme_color: '#f2f3f5', icons: [{ src: url, sizes: '180x180', type: 'image/png' }] };
      var ml = document.createElement('link'); ml.rel = 'manifest';
      ml.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(ml);
    }
  } catch (e) {}
}

/* ================== Start ================== */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
document.querySelectorAll('.msw').forEach(function(el){
  el.innerHTML = '<button type="button" class="mbtn" data-act="prev" aria-label="Prethodni mesec">' + ic('chevL') + '</button>' +
    '<div class="mlabel"><span class="msw-label"></span><button type="button" class="mnow" data-act="today" hidden>Tekući mesec</button></div>' +
    '<button type="button" class="mbtn" data-act="next" aria-label="Sledeći mesec">' + ic('chevR') + '</button>';
});
document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = ic(el.getAttribute('data-ic')) + el.innerHTML; });
setupIcon();
ready = true;
renderAll();
renderSyncUi();
stagger($('#v-home'));
if (loggedIn()) doSync({ force: true });
$('#topTitle').textContent = TITLES.home;
})();
</script>
