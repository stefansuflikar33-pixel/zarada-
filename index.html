<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c0b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zarada">
<meta name="format-detection" content="telephone=no">
<title>Mesečna zarada</title>
<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --card2:#f5f7f6; --field:#f0f2f3; --text:#0c1412; --muted:#69736e; --faint:#b2bab6;
  --line:rgba(12,20,18,.08); --line2:rgba(12,20,18,.15); --soft:#eceff0;
  --acc:#16a34a; --acc2:#22c55e; --acc-deep:#15803d; --acc-ink:#ffffff; --acc-soft:#e2f6e8; --acc-text:#137a39; --acc-line:#9fdcb4;
  --red:#e5484d; --red-soft:#fdeceb; --red-text:#b4232a; --red-line:#f5b5b5;
  --amber:#f59e0b; --amber-soft:#fff2da; --amber-text:#8a4b06; --amber-line:#f3cd85;
  --pink-soft:#fde7ef; --pink-text:#be185d; --blue-soft:#e6efff; --blue-text:#1d4ed8;
  --overlay:rgba(8,14,12,.38);
  --sh1:0 1px 2px rgba(16,24,20,.04),0 6px 20px rgba(16,24,20,.06);
  --sh2:0 14px 36px rgba(16,24,20,.18),0 2px 6px rgba(16,24,20,.06);
  --hero-a:#22c55e; --hero-b:#15803d; --hero-sh:0 16px 34px rgba(22,163,74,.30);
  --glass:rgba(214,240,224,.6); --jar-line:#2b4a37; --lid:#16a34a;
  --bar-bg:rgba(249,250,250,.84);
  --wal-a:#2dd4bf; --wal-b:#0f5f58; --wal-text:#0f766e; --wal-ring:rgba(45,212,191,.35);
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0c0b; --card:#161a19; --card2:#1d2221; --field:#222827; --text:#eef2f0; --muted:#98a29d; --faint:#525a56;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14); --soft:#232928;
    --acc:#22c55e; --acc2:#4ade80; --acc-deep:#16a34a; --acc-ink:#03210e; --acc-soft:rgba(34,197,94,.15); --acc-text:#5ee38c; --acc-line:rgba(34,197,94,.45);
    --red:#ff5a5f; --red-soft:rgba(255,90,95,.14); --red-text:#ff9296; --red-line:rgba(255,90,95,.42);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.13); --amber-text:#fcd36b; --amber-line:rgba(251,191,36,.4);
    --pink-soft:rgba(244,114,182,.15); --pink-text:#f9a8d4; --blue-soft:rgba(96,165,250,.15); --blue-text:#93c5fd;
    --overlay:rgba(0,0,0,.58);
    --sh1:0 0 0 1px rgba(255,255,255,.035);
    --sh2:0 16px 40px rgba(0,0,0,.6);
    --hero-a:#1fae56; --hero-b:#0b5a2a; --hero-sh:0 16px 34px rgba(0,0,0,.5);
    --glass:rgba(255,255,255,.07); --jar-line:#a3c9b0; --lid:#22c55e;
    --bar-bg:rgba(20,24,23,.84);
    --wal-a:#22b8a6; --wal-b:#0b4a45; --wal-text:#5eead4; --wal-ring:rgba(94,234,212,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.42 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red-text)!important}
.pos{color:var(--acc-text)!important}
.empty{font-size:14.5px;color:var(--muted);margin:2px 2px 6px}
.hint{font-size:13.5px;color:var(--muted);margin:12px 2px 0;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Strane i zaglavlja ---------- */
#app{max-width:560px;margin:0 auto}
.view{padding:0 16px calc(160px + env(safe-area-inset-bottom));min-height:100vh}
.view.in-r{animation:inR .36s cubic-bezier(.22,.9,.3,1) both}
.view.in-l{animation:inL .36s cubic-bezier(.22,.9,.3,1) both}
@keyframes inR{from{opacity:0;transform:translate3d(28px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-28px,0,0)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 16px) 2px 14px}
.vh-tt{min-width:0}
.vh-sub{margin:0 0 2px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vh h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.028em}
.iconbtn{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--text);padding:0;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.iconbtn:active,
.iconbtn.is-pressed{transform:scale(.88) rotate(-20deg);transition-duration:.08s}
.iconbtn svg{width:22px;height:22px}
.topbar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(env(safe-area-inset-top) + 46px);padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;pointer-events:none;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-bottom:.5px solid var(--line2);opacity:0;transform:translateY(-8px);transition:opacity .22s,transform .22s}
.topbar.show{opacity:1;transform:none}

/* ---------- Kartice ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh1);margin-bottom:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;min-height:32px}
.card-h h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;min-width:0}
.sec-t{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 6px 8px}
.ibtn{width:44px;height:44px;margin:-10px -10px -10px 0;border:0;background:none;display:grid;place-items:center;flex:none;padding:0;color:inherit}
.ibtn span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:italic 700 15px/1 Georgia,"Times New Roman",serif;background:var(--soft);color:var(--muted);transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.ibtn:active span,
.ibtn.is-pressed span{transform:scale(.82)}

/* ---------- Početna ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:18px 20px 18px;color:#fff;margin-bottom:14px;
  background:linear-gradient(150deg,var(--hero-a),var(--hero-b));box-shadow:var(--hero-sh);transition:box-shadow .4s}
.hero::before{content:"";position:absolute;z-index:-1;width:280px;height:280px;right:-100px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 70%)}
.hero::after{content:"";position:absolute;z-index:-1;width:200px;height:200px;left:-80px;bottom:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.hero.st-red{--hero-a:#fb7185;--hero-b:#be123c;--hero-sh:0 16px 34px rgba(190,18,60,.32)}
.hero.st-amber{--hero-a:#fde047;--hero-b:#f59e0b;--hero-sh:0 16px 34px rgba(217,119,6,.32);color:#3a2500}
.hero.st-amber .hero-mini{background:rgba(255,255,255,.32)}
.hero.st-amber .bar{background:rgba(58,37,0,.15)}
.hero.st-amber .bar>i{background:#3a2500}
.hero.st-amber .ibtn span{background:rgba(58,37,0,.12);color:#3a2500}
.hero.st-amber .hero-set{background:rgba(58,37,0,.12);color:#3a2500}
.hero.st-neutral{--hero-a:#5b8def;--hero-b:#3047b8;--hero-sh:0 16px 34px rgba(48,71,184,.3)}
.hero.flash{animation:heroFlash .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes heroFlash{0%{transform:scale(.95)}45%{transform:scale(1.025)}100%{transform:none}}
.hero-tap{display:block;width:100%;border:0;background:none;color:inherit;text-align:left;padding:0;margin:0;font:inherit;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.hero-tap:active,
.hero-tap.is-pressed{transform:scale(.97);transition-duration:.08s}
.hero-num{transform-origin:left center}
.hero-num.bump{animation:bump .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
.hero-dots{display:flex;align-items:center;gap:5px;margin-top:6px}
.hero-dots i{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.35;transition:width .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.hero-dots i.on{width:18px;opacity:.95}
.hero-dots span{font-size:11.5px;font-weight:600;opacity:.75;margin-left:6px}
.today-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today-grid>div{background:var(--card2);border-radius:15px;padding:10px 12px;min-width:0}
.today-grid .k{font-size:12px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:5px;white-space:nowrap}
.today-grid .k i{width:8px;height:8px;border-radius:50%;flex:none}
.today-grid .v{font-size:19px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;margin-top:2px}
.today-goal{margin-top:14px}
.hic{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;flex:none;margin-right:10px}
.hic svg{width:18px;height:18px}
.hic.g{background:var(--acc-soft);color:var(--acc-text)}
.hic.a{background:var(--amber-soft);color:var(--amber-text)}
.hic.r{background:var(--red-soft);color:var(--red-text)}
.hic.b{background:var(--blue-soft);color:var(--blue-text)}
.hic.p{background:var(--pink-soft);color:var(--pink-text)}
.vh-btns{display:flex;gap:8px}
.sd{position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px var(--card)}
.sd.none{display:none}
.sd.ok{background:var(--acc)}
.sd.busy{background:#5b8def;animation:pulse 1s ease-in-out infinite}
.sd.off{background:var(--amber)}
.sd.err{background:var(--red)}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}
.sync-st{font-size:14px;margin:10px 2px 0;color:var(--muted);line-height:1.45}
.sync-st.ok{color:var(--acc-text)}
.burst{position:fixed;z-index:86;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,#fff6c2,#f7c21b 52%,#c98a00);box-shadow:inset 0 0 0 1.5px rgba(150,100,0,.35);
  animation:burst .95s cubic-bezier(.2,.7,.3,1) both}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}55%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:1}100%{transform:translate(calc(var(--dx) * 1.15),calc(var(--dy) + 70px)) scale(.8) rotate(300deg);opacity:0}}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero-lbl{font-size:15.5px;font-weight:650;opacity:.92}
.hero .ibtn span{background:rgba(255,255,255,.22);color:#fff}
.hero-num{font-size:clamp(46px,14.5vw,66px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;white-space:nowrap}
.hero-num.long{font-size:44px}
.hero-num .cur{font-size:.3em;font-weight:700;opacity:.82;margin-left:6px;letter-spacing:0}
.hero-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px}
.hero-mini .k{font-size:11.5px;font-weight:600;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-mini .v{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hero-goal{margin-top:14px}
.hg-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:650;margin-bottom:7px}
.hero .bar{background:rgba(255,255,255,.24);height:9px}
.hero .bar>i{background:#fff}
.hg-note{font-size:13.5px;margin-top:8px;opacity:.95}
.hero-set{margin-top:14px;width:100%;min-height:50px;border:0;border-radius:15px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.hero-set:active,
.hero-set.is-pressed{transform:scale(.97);transition-duration:.08s}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.act{border:0;border-radius:22px;background:var(--card);box-shadow:var(--sh1);padding:15px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:var(--text);
  transition:transform .32s cubic-bezier(.3,1.7,.5,1)}
.act:active,
.act.is-pressed{transform:scale(.94);transition-duration:.08s}
.act .ai{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.act .ai svg{width:24px;height:24px}
.act.work .ai{background:linear-gradient(150deg,var(--acc2),var(--acc-deep));color:#fff;box-shadow:0 6px 14px rgba(22,163,74,.3)}
.act.spend .ai{background:var(--amber-soft);color:var(--amber-text)}
.act b{display:block;font-size:17px;font-weight:750;letter-spacing:-.01em}
.act small{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tips{display:grid;gap:10px}
.tip{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--sh1);padding:6px 10px 6px 12px;min-height:62px}
.tips.anim .tip{animation:tipIn .5s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
@keyframes tipIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.tip .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.tip .dot svg{width:20px;height:20px}
.tip.green .dot{background:var(--acc-soft);color:var(--acc-text)}
.tip.red .dot{background:var(--red-soft);color:var(--red-text)}
.tip.amber .dot{background:var(--amber-soft);color:var(--amber-text)}
.tip.gray .dot{background:var(--soft);color:var(--muted)}
.tip-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:8px 0;display:flex;align-items:center;gap:8px;min-height:48px;color:var(--text)}
.tip-main .tt{flex:1;min-width:0}
.tip-main b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.tip-main .s{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tip-main .go{flex:none;font-size:14px;font-weight:700;color:var(--acc-text);display:flex;align-items:center;gap:2px}
.tip-main .go svg{width:16px;height:16px}
button.tip-main{transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
button.tip-main:active,
button.tip-main.is-pressed{transform:scale(.97);transition-duration:.08s}
.tip .ibtn{margin:0}

/* ---------- Progres trake ---------- */
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.bar>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transform:translate3d(-100%,0,0);transition:transform 1s cubic-bezier(.22,1,.36,1)}
.bar.amber>i{background:var(--amber)}
.bar.red>i{background:var(--red)}
.bar.blue>i{background:#5b8def}
.bar.thin{height:7px}
.bar-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:13.5px;color:var(--muted);margin-top:8px}
.bar-meta b{color:var(--text)}

/* ---------- Mesec ---------- */
.msw{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.mbtn{width:46px;height:46px;flex:none;border-radius:15px;border:0;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--text);padding:0;transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.mbtn:active:not(:disabled),
.mbtn.is-pressed:not(:disabled){transform:scale(.88);transition-duration:.08s}
.mbtn:disabled{opacity:.3}
.mbtn svg{width:22px;height:22px}
.mlabel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.msw-label{font-size:18px;font-weight:750;letter-spacing:-.01em}
.mnow{position:relative;border:0;background:var(--acc-soft);color:var(--acc-text);font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 11px;margin-top:3px}
.mnow::before{content:"";position:absolute;inset:-10px -8px}

/* ---------- Kalendar ---------- */
.cal{padding:14px 12px 16px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-week div{text-align:center;font-size:12px;color:var(--muted);font-weight:650;padding:0 0 6px}
.cal-grid.sl-n{animation:slN .34s cubic-bezier(.22,.9,.3,1)}
.cal-grid.sl-p{animation:slP .34s cubic-bezier(.22,.9,.3,1)}
@keyframes slN{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slP{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.day{position:relative;min-height:50px;aspect-ratio:1/1.22;border:0;border-radius:14px;background:var(--card2);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px 1px;min-width:0;
  transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.day:active,
.day.is-pressed{transform:scale(.88);transition-duration:.08s}
.day .dn{font-size:15px;font-weight:700;line-height:1}
.day .amt{font-size:9.5px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.day .multi{position:absolute;top:5px;right:6px;display:flex;gap:2px}
.day .multi i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.day .sp{position:absolute;top:5px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.day .amt.w{color:var(--acc-text)}
.day .amt.t{color:var(--amber-text)}
.day.work{background:var(--acc-soft);color:var(--acc-text)}
.day.off{background:var(--soft);color:var(--muted)}
.day.missing{background:var(--red-soft);color:var(--red-text)}
.day.future{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1.5px var(--line)}
.day.today{box-shadow:inset 0 0 0 2.5px var(--acc)}
.day.blank{visibility:hidden}
.day.pop{animation:dayPop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes dayPop{0%{transform:scale(.55)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.cal-note{font-size:13.5px;color:var(--muted);margin:12px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 4px 0;font-size:12.5px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg-work{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.lg-off{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line2)}
.lg-miss{background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red-line)}
.lg-today{box-shadow:inset 0 0 0 2px var(--acc)}
.lg-w,.lg-t{font-size:11px;font-weight:800}
.lg-w{color:var(--acc-text)}
.lg-t{color:var(--amber-text)}
.lg-sp{background:var(--red);border-radius:50%!important;width:8px!important;height:8px!important}

.stat .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.pay{background:var(--card2);border-radius:18px;padding:14px;margin-bottom:10px}

/* ---------- Dugmad i polja ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 18px;border-radius:16px;border:0;background:var(--soft);color:var(--text);
  font-weight:680;font-size:16.5px;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .2s,background .2s}

.btn svg{width:19px;height:19px}

.editbtn{width:50px;height:50px;border:0;background:var(--soft);border-radius:16px;color:var(--muted);display:grid;place-items:center;padding:0;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.editbtn:active,
.editbtn.is-pressed{transform:scale(.9);transition-duration:.08s}
.editbtn svg{width:20px;height:20px}
.inp{width:100%;min-height:50px;border:0;border-radius:14px;padding:0 14px;font-size:17px;background:var(--field);min-width:0;color:var(--text);transition:box-shadow .15s}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.inp::placeholder{color:var(--faint)}
input[type=date].inp{padding:0 12px;-webkit-appearance:none;appearance:none;display:flex;align-items:center}
.money{position:relative;min-width:0}
.money .inp{padding-right:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;font-weight:650}
.money.big .inp{min-height:76px;font-size:38px;font-weight:800;text-align:center;padding:0 64px;letter-spacing:-.025em;border-radius:20px}
.money.big span{font-size:16px;right:18px}
.lbl{display:block;font-size:14px;font-weight:650;color:var(--muted);margin:0 2px 7px}
.field{margin-bottom:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:15px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:680;color:var(--muted);font-size:15px;transition:background .2s,color .2s,box-shadow .2s,transform .28s cubic-bezier(.3,1.7,.5,1)}
.seg button:active,
.seg button.is-pressed{transform:scale(.95)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.goal-exp{background:var(--card2);border-radius:14px;padding:13px 14px;font-size:15px}
.goal-prog{margin-top:16px}
.xbtn{width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:12px;display:grid;place-items:center;flex:none;padding:0}
.xbtn svg{width:18px;height:18px}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:750;border-radius:99px;padding:1px 8px;line-height:1.45;white-space:nowrap}
.badge.red{background:var(--red);color:#fff}
.badge.amber{background:var(--amber-soft);color:var(--amber-text)}
.badge.green{background:var(--acc-soft);color:var(--acc-text)}
.badge.gray{background:var(--soft);color:var(--muted)}

/* ---------- Troškovi ---------- */
.exp-sum{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin:0 0 8px}
.exp-sum b{color:var(--text)}
.elist{margin-top:10px}
.erow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 0}
.erow:first-child{border-top:0}
.chk{width:44px;height:48px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0;margin-left:-6px}
.chk i{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line2);display:grid;place-items:center;color:transparent;transition:background .25s,box-shadow .25s,transform .35s cubic-bezier(.3,1.7,.5,1)}
.chk i svg{width:16px;height:16px;stroke-width:3}
.chk:active i,
.chk.is-pressed i{transform:scale(.8)}
.chk.on i{background:var(--acc);box-shadow:none;color:#fff}
.chk.pop i{animation:chkPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes chkPop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.erow.late .chk i{box-shadow:inset 0 0 0 2px var(--red)}
.emain{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;align-items:center;gap:10px;min-height:52px;padding:0;color:var(--text)}
.emain .en{flex:1;min-width:0}
.emain b{display:block;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emain small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:1px}
.emain .ea{font-weight:750;font-size:16px;white-space:nowrap}
.erow.paid .en b,.erow.paid .ea{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.debt{background:var(--card2);border-radius:18px;padding:14px;margin-bottom:10px}
.debt-top{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:16px}
.debt-top span{color:var(--muted);font-weight:650}
.debt-amt{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.debt-amt small{font-size:13px;color:var(--muted);font-weight:650;letter-spacing:0}
.debt-btns{display:grid;grid-template-columns:1fr 50px;gap:8px;margin-top:12px}
.debt-btns .btn{background:var(--card)}
.debt-btns .editbtn{background:var(--card)}

/* ---------- Kasice ---------- */
.save-top{display:flex;align-items:center;gap:14px}
.save-top .pigw{width:68px}
.save-top .k{font-size:14px;color:var(--muted);font-weight:650}
.save-top .v{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.save-top .v small{font-size:14px;color:var(--muted);font-weight:650;letter-spacing:0}
.save-top .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.jar{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1);padding:16px;margin-bottom:14px}
.jar-in{display:flex;gap:14px;align-items:center}
.pigw{position:relative;width:92px;flex:none}
.pig{width:100%;height:auto;overflow:visible;transform-origin:50% 96%}
.pig .glass{fill:var(--glass)}
.pig .gl{fill:none;stroke:var(--jar-line);stroke-width:3.5}
.pig .neck{fill:var(--glass);stroke:var(--jar-line);stroke-width:3.5}
.pig .lid{fill:var(--lid);stroke:var(--jar-line);stroke-width:3.5}
.pig .slot{fill:var(--jar-line)}
.pig .hl{fill:#fff;opacity:.5}
.pig-fill{transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
.pig.jig{animation:jig .65s cubic-bezier(.3,1.6,.5,1)}
@keyframes jig{0%{transform:scale(1)}28%{transform:scale(1.09,.93)}52%{transform:scale(.95,1.06)}74%{transform:scale(1.02,.99)}100%{transform:scale(1)}}
.jar.locked .pig{filter:grayscale(1);opacity:.5}
.lockb{position:absolute;right:-2px;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--muted)}
.lockb svg{width:16px;height:16px}
.jar-info{flex:1;min-width:0}
.jar-name{font-weight:750;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.25}
.jar-amt{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:4px 0 8px;line-height:1.15}
.jar-amt small{font-size:13px;color:var(--muted);font-weight:650;letter-spacing:0;white-space:nowrap}
.jar-pct{font-size:13px;color:var(--muted);font-weight:650;margin-top:6px}
.jar-lines{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.jar-lines b{color:var(--text)}
.jar-btns{display:grid;grid-template-columns:1fr 1fr 50px;gap:8px;margin-top:14px}
.coin{position:absolute;left:50%;top:10%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 34% 30%,#fff6c2,#f7c21b 52%,#c98a00);box-shadow:inset 0 0 0 2px rgba(150,100,0,.35),0 2px 4px rgba(0,0,0,.18);
  animation:coinDrop .62s cubic-bezier(.55,0,.75,1) both}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(150,100,0,.3)}
@keyframes coinDrop{0%{transform:translateY(-78px) rotate(-30deg);opacity:0}18%{opacity:1}74%{transform:translateY(-3px) rotate(0) scaleX(1);opacity:1}100%{transform:translateY(8px) scaleX(.12);opacity:0}}
.coin.out{animation:coinOut .75s cubic-bezier(.2,.8,.3,1) both}
@keyframes coinOut{0%{transform:translateY(8px) scaleX(.12);opacity:0}25%{transform:translateY(-6px) scaleX(1);opacity:1}100%{transform:translateY(-90px) rotate(35deg);opacity:0}}
.wallet-bal{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px;white-space:nowrap}
.wallet-bal small{font-size:15px;color:var(--muted);font-weight:650;letter-spacing:0}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:6px;align-items:center;padding:2px 0;border-top:1px solid var(--line);font-size:14.5px}
.tx .note2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .note2 small{color:var(--muted);margin-right:6px}
.txs{margin-top:4px}
.tx .acc{font-size:10.5px;font-weight:750;color:var(--blue-text);background:var(--blue-soft);border-radius:99px;padding:1px 6px;margin-left:6px}
.wal{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:18px 20px 12px;color:#fff;margin-bottom:14px;
  background:linear-gradient(150deg,#2dd4bf,#0f5f58);box-shadow:0 16px 34px rgba(15,95,88,.3)}
.wal::before{content:"";position:absolute;z-index:-1;width:280px;height:280px;right:-100px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 70%)}
.wal-top{display:flex;justify-content:space-between;align-items:center}
.wal-lbl{font-size:15.5px;font-weight:650;opacity:.92}
.wal .ibtn span{background:rgba(255,255,255,.22);color:#fff}
.wal-num{font-size:clamp(44px,13vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;white-space:nowrap;transform-origin:left center}
.wal-num .cur{font-size:.32em;font-weight:700;opacity:.82;margin-left:6px;letter-spacing:0}
.wal-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;background:rgba(255,255,255,.15);border-radius:16px;padding:10px 12px}
.wal-mini .k{font-size:12px;opacity:.88;font-weight:600;white-space:nowrap}
.wal-mini .v{font-size:17px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wal-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.wal-btns .btn{background:rgba(255,255,255,.2);color:#fff;min-height:50px;font-size:15.5px;padding:0 6px}
.wal-btns .btn.main{background:#fff;color:#0f5f58;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.wal-move{display:block;margin:6px auto 0;border:0;background:none;color:#fff;opacity:.92;font-weight:650;font-size:14px;min-height:44px;padding:0 12px}
.env{display:block;height:4px;border-radius:99px;background:var(--soft);margin-top:6px;overflow:hidden;max-width:170px}
.env>i{display:block;height:100%;background:var(--amber);border-radius:99px}
.alrow{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.alrow b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alrow small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.alsum{font-size:14px;color:var(--muted);padding:12px 2px 2px;line-height:1.45}
.alsum b{color:var(--text)}
.alsum.warn,.alsum.warn b{color:var(--amber-text)}
.ins-emoji{font-size:66px;text-align:center;line-height:1;margin:2px 0 8px;animation:wobble 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes wobble{0%{transform:scale(.3) rotate(-30deg)}40%{transform:scale(1.18) rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}100%{transform:none}}
.ins-h{text-align:center;font-size:17px;font-weight:750;margin:0 0 10px}
.ins-list{display:grid;gap:8px;margin:6px 0}
.ins-list div{background:var(--card2);border-radius:14px;padding:11px 13px;font-size:15px;line-height:1.4;animation:tipIn .45s cubic-bezier(.2,.9,.3,1.12) both}
.ins-tip{background:var(--acc-soft);color:var(--acc-text);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;margin-top:10px;line-height:1.45}

/* ---------- Grafikoni ---------- */
.chart h3{font-size:18px;font-weight:750;letter-spacing:-.01em;margin:0 0 6px;display:flex;align-items:center}
.chart .cap{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--line);padding-top:22px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .b i{display:block;width:100%;max-width:36px;border-radius:9px 9px 3px 3px;background:color-mix(in srgb,var(--acc) 38%,var(--soft));min-height:2px;transform-origin:50% 100%}
.bars .b.top i{background:linear-gradient(180deg,var(--acc2),var(--acc))}
.bars .b em{position:absolute;font-style:normal;font-size:11px;color:var(--muted);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .b.top em{color:var(--acc-text);font-weight:800}
.anim .bars .b i{animation:grow .85s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
.anim .bars .b em{animation:fadeUp .45s ease-out both;animation-delay:calc(var(--d,0ms) + 380ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bars.thin{gap:2px;height:120px}
.bars.thin .b i{border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--red) 62%,var(--soft));min-height:0}
.bars.thin .b.today i{background:var(--red)}
.bars.thin.tp .b i{background:color-mix(in srgb,var(--amber) 70%,var(--soft))}
.bars.thin.tp .b.top i{background:var(--amber)}
.bars.wk .b i{background:color-mix(in srgb,var(--red) 42%,var(--soft))}
.bars.wk .b.top i{background:linear-gradient(180deg,#fb7185,var(--red))}
.bars.wk .b.top em{color:var(--red-text)}
.xlab.wk span{font-size:10.5px}
.xlab{display:flex;gap:8px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:650}
.xlab.thin{gap:2px}
.xlab.thin span{font-size:10px}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.week>div{background:var(--card2);border-radius:14px;padding:10px 12px;min-width:0}
.week .k{font-size:12.5px;color:var(--muted);font-weight:650}
.week .v{font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-msg{font-size:14px;color:var(--muted);margin:12px 2px 0}
.hist{width:100%;text-align:left;border:0;background:var(--card2);border-radius:16px;padding:12px 14px;margin-top:8px;display:block;color:var(--text);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.hist:active,
.hist.is-pressed{transform:scale(.97);transition-duration:.08s}
.hist.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.hist-top em{font-style:normal;font-size:12px;font-weight:650;color:var(--acc-text);margin-left:6px}
.hist .bar{height:7px;margin:8px 0 6px;background:var(--soft)}
.hist-sub{font-size:13px;color:var(--muted)}

/* ---------- Donja navigacija i + ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,calc(50% - 280px)) calc(4px + env(safe-area-inset-bottom));
  background:var(--card);background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line2)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:10.5px;font-weight:650;padding:0}
.tab svg{width:26px;height:26px;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tab:active svg,
.tab.is-pressed svg{transform:scale(.8);transition-duration:.08s}
.tab.on{color:var(--acc)}
.tab.on svg{animation:tabPop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes tabPop{0%{transform:scale(.7) translateY(3px)}55%{transform:scale(1.18) translateY(-2px)}100%{transform:none}}
svg .f{fill:none}
.tab.on svg .f,.qi svg .f{fill:currentColor;fill-opacity:.18}
.fab{position:fixed;z-index:26;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:21px;border:0;padding:0;
  background:linear-gradient(150deg,var(--acc2),var(--acc-deep));color:var(--acc-ink);display:grid;place-items:center;
  box-shadow:0 12px 26px rgba(22,163,74,.38),0 2px 6px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.fab:active,
.fab.is-pressed{transform:scale(.86);transition-duration:.08s}
.fab svg{width:30px;height:30px;stroke-width:2.6;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.fab.open svg{transform:rotate(135deg)}

/* ---------- Novčanik: istaknuto dugme u sredini bara ---------- */
.tab.wtab{position:relative;justify-content:flex-end;gap:2px;padding-bottom:1px;color:var(--muted)}
.wt-orb{position:relative;width:60px;height:60px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--wal-a),var(--wal-b));box-shadow:0 10px 22px rgba(15,95,88,.38),0 0 0 5px var(--bg);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tab.wtab svg{width:29px;height:29px}
.tab.wtab svg .f{fill:#fff;fill-opacity:.22}
.tab.wtab.on svg{animation:none}

.wt-badge.in{background:var(--acc);animation:badgePop 1.5s cubic-bezier(.3,1.5,.5,1) both}
.wt-badge.out{background:var(--red);animation:badgePop 1.5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes badgePop{0%{opacity:0;transform:scale(.3) translateY(8px)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
.wtab.got .wt-orb{animation:orbGot .8s cubic-bezier(.3,1.6,.5,1)}
.wtab.hit .wt-orb{animation:orbHit .7s cubic-bezier(.3,1.2,.5,1)}
@keyframes orbGot{0%{transform:scale(1)}30%{transform:scale(1.22) translateY(-4px);box-shadow:0 10px 22px rgba(15,95,88,.38),0 0 0 5px var(--bg),0 0 0 14px rgba(34,197,94,.35)}100%{transform:none}}
@keyframes orbHit{0%,100%{transform:none}15%{transform:translateX(-6px) rotate(-12deg)}30%{transform:translateX(6px) rotate(12deg);background:linear-gradient(150deg,#fb7185,#be123c)}45%{transform:translateX(-5px) rotate(-8deg)}60%{transform:translateX(4px) rotate(6deg)}78%{transform:translateX(-2px)}}

/* ---------- Novčanik: kartica, novčanik koji se otvara ---------- */
.wal-row{display:flex;align-items:center;gap:10px}
.wal-row .wal-num{flex:1;min-width:0;font-size:clamp(36px,11vw,52px)}
.wal-row .wal-num.long{font-size:clamp(30px,9vw,40px)}
.wal-num.hit{animation:numHit .75s cubic-bezier(.3,1.2,.5,1)}
.wal-num.got{animation:bump .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes numHit{0%,100%{transform:none;color:inherit}15%{transform:translateX(-6px);color:#ffd2d2}35%{transform:translateX(6px);color:#ffd2d2}55%{transform:translateX(-4px);color:#ffd2d2}75%{transform:translateX(2px)}}
.walw{position:relative;width:96px;flex:none;margin:-4px -4px 0 0}
.wl{width:100%;height:auto;display:block;overflow:visible}
.wl .whole,.wl .flap,.wl .bill{transform-box:fill-box}
.wl .whole{transform-origin:50% 100%}
.wl .flap{transform-origin:50% 0%}
.wl .bill{opacity:0;transform-origin:50% 50%}
.wl.in .flap{animation:flapOpen 1.2s cubic-bezier(.3,1.25,.5,1) both}
.wl.in .bill{animation:billIn 1.2s cubic-bezier(.45,0,.3,1) both}
.wl.in .whole{animation:walSquash 1.2s ease-out both}
.wl.out .whole{animation:walShake .8s cubic-bezier(.3,1.2,.5,1) both}
.wl.out .coinout{animation:coinOutW .8s cubic-bezier(.2,.7,.4,1) both}
.wl .coinout{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flapOpen{0%{transform:scaleY(1)}16%{transform:scaleY(-.6)}60%{transform:scaleY(-.6)}76%{transform:scaleY(1.1)}88%{transform:scaleY(.95)}100%{transform:scaleY(1)}}
@keyframes billIn{0%{opacity:0;transform:translate(14px,-150%) rotate(-18deg)}12%{opacity:1}34%{transform:translate(4px,-110%) rotate(-7deg)}62%{opacity:1;transform:translate(0,4%) rotate(0)}80%{opacity:1;transform:translate(0,8%)}100%{opacity:0;transform:translate(0,8%)}}
@keyframes walSquash{0%,66%{transform:none}76%{transform:scale(1.1,.88)}88%{transform:scale(.96,1.05)}100%{transform:none}}
@keyframes walShake{0%,100%{transform:none}10%{transform:translateX(-8px) rotate(-9deg)}22%{transform:translateX(8px) rotate(9deg)}34%{transform:translateX(-7px) rotate(-7deg)}46%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(2px) rotate(1deg)}}
@keyframes coinOutW{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--cx,10px),46px) rotate(220deg)}}
.wfloat{position:absolute;right:6px;top:-4px;z-index:3;padding:3px 10px;border-radius:99px;font-weight:800;font-size:15px;color:#fff;pointer-events:none;white-space:nowrap;animation:wFloat 1.4s cubic-bezier(.2,.8,.3,1) both}
.wfloat.in{background:var(--acc)}
.wfloat.out{background:var(--red)}
@keyframes wFloat{0%{opacity:0;transform:translateY(14px) scale(.7)}18%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.wal-links{display:flex;justify-content:center;gap:4px;margin-top:4px}
.wal-links .wal-move{margin:0}
.fx-card.wfx .walw{width:150px;margin:0 auto}
.fx-card.wfx b.minus{color:var(--red-text)}

/* ---------- Novčanik: bankarov limit i lista keš potrošnje ---------- */
.guard{display:flex;align-items:center;gap:12px}
.guard-face{width:48px;height:48px;flex:none;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.guard-face svg{width:44px;height:44px;margin-top:8px}
.guard-t{flex:1;min-width:0}
.guard-t b{display:block;font-size:16px;font-weight:750}
.guard-t span{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.guard .bar{margin-top:12px}
.guard-wrap.over .guard-t b{color:var(--red-text)}
.mini-sw{display:flex;align-items:center;gap:2px}
.mini-sw button{width:38px;height:38px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center;padding:0;color:var(--text);transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.mini-sw button:disabled{opacity:.3}

.mini-sw svg{width:18px;height:18px}
.mini-sw span{font-size:13.5px;font-weight:700;min-width:96px;text-align:center}
.ws-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--card2);border-radius:16px;padding:12px 14px}
.ws-tot span{font-size:13.5px;color:var(--muted);font-weight:650}

.ws-day{margin-top:16px}
.ws-dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px 6px;border-bottom:1px solid var(--line)}
.ws-dh b{font-size:14px;letter-spacing:0;color:var(--text)}
.ws-dh.over b{color:var(--red-text)}
.ws-dh .bk-mark{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:99px;padding:1px 7px;margin-left:6px;letter-spacing:0;text-transform:none}
.ws-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 40px;gap:8px;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.ws-row:last-child{border-bottom:0}
.ws-row .em{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.ws-row .nt{min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ws-row .am{font-weight:780;font-size:15.5px;white-space:nowrap}

.ws-row.big .am{color:var(--red-text)}
.ws-row .xbtn{width:40px}
.ws-row.new{animation:rowIn .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rowIn{0%{opacity:0;transform:translateX(-24px);background:var(--red-soft)}60%{opacity:1;transform:none}100%{background:transparent}}
.subseg{margin:0 0 14px}

/* ---------- Ponuda štednje posle ubacivanja ---------- */
.st-in{text-align:center;font-size:14.5px;color:var(--muted);font-weight:650;margin:0 0 4px}
.st-in b{color:var(--acc-text)}
.st-amt{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:2px 0 2px}
.st-amt small{font-size:16px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}

.st-sub{text-align:center;font-size:13.5px;color:var(--muted);margin:0 0 14px}
.st-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.st-chips .chip{position:relative;padding:0 6px;min-height:52px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px}
.st-chips .chip small{font-size:11.5px;font-weight:650;opacity:.75}
.st-chips .chip.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--muted)}
.st-chips .chip .rec{font-style:normal;position:absolute;top:-8px;right:-4px;font-size:10px;font-weight:800;background:var(--amber);color:#3a2500;border-radius:99px;padding:1px 6px}
.st-own{margin:0 0 12px}
.st-bank{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:var(--amber-text);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;margin:0 0 12px}

.st-split{background:var(--card2);border-radius:16px;padding:6px 14px 10px}

.st-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}

/* ---------- Strogi bankar ---------- */
.bk{position:fixed;inset:0;z-index:88}

.bk.bye .bk-bg{animation:bkFadeOut .3s both}
@keyframes bkFade{from{opacity:0}to{opacity:1}}
@keyframes bkFadeOut{to{opacity:0}}
.bk-wrap{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;pointer-events:none}
.bk-bubble{pointer-events:auto;position:relative;background:var(--card);border-radius:24px;padding:0;box-shadow:var(--sh2);max-height:calc(100vh - 168px);max-height:calc(100dvh - 168px);overflow:hidden;display:flex;flex-direction:column;
  transform-origin:18% 100%;animation:bkBubble .55s .3s cubic-bezier(.3,1.5,.5,1) both;border-top:5px solid var(--red)}
.bk.bye .bk-bubble{animation:bkOut .28s ease-in both}

@keyframes bkBubble{from{opacity:0;transform:scale(.55) translateY(30px)}to{opacity:1;transform:none}}
@keyframes bkOut{to{opacity:0;transform:scale(.9) translateY(20px)}}
@keyframes bkDown{to{transform:translateY(110%)}}
.bk-man{position:relative;width:118px;height:120px;margin:6px 0 0 8px;overflow:visible;animation:bkRise .65s cubic-bezier(.3,1.35,.5,1) both}

@keyframes bkRise{from{transform:translateY(110%)}to{transform:none}}
.bk-man .arm{transform-box:view-box;transform-origin:112px 138px;animation:wag .42s .7s ease-in-out 6 alternate both}

@keyframes headShake{0%,100%{transform:none}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.bk-who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red-text);margin:0 0 6px}

.bk-h{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
.bk-h2{font-size:14.5px;font-weight:600;color:var(--muted);margin:0 0 10px;line-height:1.4}

.bk-lines{display:grid;gap:6px;margin:0 0 10px}
.bk-lines div{background:var(--card2);border-radius:13px;padding:8px 12px;font-size:14px;line-height:1.38;animation:tipIn .45s cubic-bezier(.2,.9,.3,1.12) both}
.bk-rec{background:var(--red-soft);color:var(--red-text);border-radius:14px;padding:10px 13px;font-size:14.5px;font-weight:650;line-height:1.42;margin:0 0 10px}

.bk-scroll{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px 4px;min-height:0;flex:1 1 auto}
.bk-acts{display:grid;gap:8px;padding:8px 16px 14px;flex:none;border-top:1px solid var(--line)}
.bk-acts .btn{min-height:46px}

/* ---------- Donji panel (bottom sheet) ---------- */
.overlay{position:fixed;left:0;right:0;top:0;height:100%;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .32s;touch-action:none}
.overlay.open .backdrop{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 26px);display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 40px rgba(0,0,0,.16);transform:translate3d(0,105%,0);transition:transform .46s cubic-bezier(.3,1.15,.45,1);will-change:transform}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:90px;background:var(--card)}
.overlay.open .sheet{transform:none}
.overlay.drag .sheet,.overlay.drag .backdrop{transition:none}
.grab{height:22px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:38px;height:5px;border-radius:99px;background:var(--line2)}
.sheet-head{display:flex;align-items:center;gap:4px;padding:0 10px 6px 20px;flex:none;touch-action:none}
.sheet-head.back{padding-left:6px}
.sheet-head h3{flex:1;margin:0;font-size:19px;line-height:1.2;font-weight:780;letter-spacing:-.015em;min-width:0}
.sheet-head .xbtn{width:44px;height:44px;padding:4px;background:var(--soft);background-clip:content-box;border-radius:50%}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 18px 10px;flex:1 1 auto;min-height:0}
.sheet-foot{padding:8px 18px 14px;display:grid;gap:8px;flex:none}
.sheet-foot:empty{display:none}
.sheet.swap .sheet-body,.sheet.swap .sheet-foot{animation:swF .34s cubic-bezier(.22,.9,.3,1) both}
.sheet.swap-b .sheet-body,.sheet.swap-b .sheet-foot{animation:swB .34s cubic-bezier(.22,.9,.3,1) both}
@keyframes swF{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes swB{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.q{font-size:14px;color:var(--muted);font-weight:650;margin:2px 2px 10px}

  animation:qIn .42s cubic-bezier(.3,1.4,.5,1) both;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.qt:active,
.qt.is-pressed{transform:scale(.94);transition-duration:.08s}

.qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.qgrid.three{grid-template-columns:1fr}

.qgrid.three .qt b{font-size:17.5px}
.qgrid.three .qt small{font-size:13.5px}
.tipchips{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.tipchips .chip{background:var(--card);padding:0 14px;font-size:14.5px}
.chip.pop{animation:chkPop .4s cubic-bezier(.3,1.7,.5,1)}
.qi svg{width:23px;height:23px}
.qi.g{background:linear-gradient(150deg,var(--acc2),var(--acc-deep));color:#fff}
.qi.a{background:var(--amber-soft);color:var(--amber-text)}
.qi.p{background:var(--pink-soft);color:var(--pink-text)}
.qi.b{background:var(--blue-soft);color:var(--blue-text)}
.qi.r{background:var(--red-soft);color:var(--red-text)}
.qi.n{background:var(--soft);color:var(--muted)}
.qt b{display:block;font-size:16px;font-weight:750}
.qt small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jopt{border-radius:18px;margin-bottom:10px;overflow:hidden;background:var(--card2);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s}
.jopt.on{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc-line)}
.jopt-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;min-height:60px;color:var(--text)}
.check{width:28px;height:28px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line2);flex:none;display:grid;place-items:center;color:transparent;background:var(--card);
  transition:background .2s,box-shadow .2s,transform .35s cubic-bezier(.3,1.7,.5,1)}

.jopt-name{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jopt-rate{color:var(--muted);font-size:14px;white-space:nowrap}
.jopt-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px;animation:fadeUp .3s ease-out both}
.jopt-fields label>span{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:0 2px 5px}
.jopt-fields .inp{background:var(--card)}
.day-total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;padding:6px 4px 2px;color:var(--muted)}
.day-total b{font-size:23px;color:var(--text);font-weight:800;letter-spacing:-.02em}
.sec-h{font-size:16px;font-weight:750;margin:16px 0 6px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sec-h span{font-size:14px;color:var(--muted);font-weight:650}
.spi{display:grid;grid-template-columns:auto minmax(0,1fr) 44px;gap:10px;align-items:center;border-bottom:1px solid var(--line);font-size:15px}
.spi b{white-space:nowrap}
.spi .nt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spadd{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;margin-top:10px}
.spadd .btn{padding:0 14px}
.foot-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.foot-row .btn{font-size:15.5px;padding:0 14px}
.foot-row.one{grid-template-columns:1fr}
.foot-row.two{grid-template-columns:1fr 1fr}
.sug-big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px;line-height:1.15}
.sug-lines{font-size:14.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.sug-lines p{margin:0 0 8px}
.sug-lines b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{border:0;background:var(--soft);border-radius:99px;padding:0 16px;font-weight:700;font-size:15px;min-height:44px;color:var(--text);transition:transform .28s cubic-bezier(.3,1.7,.5,1),background .2s}
.chip:active,
.chip.is-pressed{transform:scale(.9);transition-duration:.08s}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.calc{background:var(--card2);border-radius:16px;padding:4px 14px}
.calc .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.calc .r:first-child{border-top:0}
.calc .r small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.calc .r b{white-space:nowrap}
.calc .r.tot{font-weight:800;font-size:17px;border-top:2px solid var(--line2)}
.rules-h{font-size:16px;font-weight:750;margin:18px 2px 4px}
.rules{font-size:14px;color:var(--muted);padding-left:20px;margin:6px 0 4px;line-height:1.5}
.rules li{margin:6px 0}
.rules b{color:var(--text)}
.confirm-t{font-size:16px;line-height:1.5;margin:2px 2px 10px}

/* ---------- Podešavanja ---------- */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s cubic-bezier(.22,.9,.25,1),visibility 0s linear .42s}
.page.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.22,.9,.25,1),visibility 0s}
.page-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 6px 4px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.page-head h2{margin:0;font-size:17px;font-weight:700}
.pbtn{justify-self:start;min-height:44px;border:0;background:none;color:var(--acc-text);font-weight:650;font-size:17px;display:inline-flex;align-items:center;gap:0;padding:0 10px 0 2px}
.pbtn svg{width:26px;height:26px}
.page-body{max-width:560px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.page-title{font-size:34px;font-weight:800;letter-spacing:-.028em;margin:4px 2px 4px}
.col-h{display:grid;grid-template-columns:44px minmax(0,1fr) 116px 40px;gap:6px;font-size:12.5px;color:var(--muted);font-weight:650;margin:0 0 6px}
.rows{display:grid;gap:8px}
.row.job{display:grid;grid-template-columns:44px minmax(0,1fr) 116px 40px;gap:6px;align-items:center}
.row.job .xbtn{width:40px}
.star{width:44px;height:50px;border:0;background:var(--soft);color:var(--faint);font-size:20px;border-radius:14px;line-height:1;padding:0;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.star:active,
.star.is-pressed{transform:scale(.85)}
.star.on{color:#d99a00;background:var(--amber-soft)}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2)}
.add .full{grid-column:1 / -1}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.set-row .t{font-weight:700;font-size:16px}
.set-row .d{font-size:13.5px;color:var(--muted);margin-top:2px}
.switch{width:52px;height:32px;border-radius:99px;border:0;background:var(--line2);position:relative;flex:none;padding:0;transition:background .25s}
.switch::before{content:"";position:absolute;inset:-8px -6px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(20px)}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.backup .btn{font-size:15px;padding:0 10px;white-space:normal;line-height:1.2;text-align:center}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:22px 10px 0}

/* ---------- Obaveštenja i efekti ---------- */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));z-index:80;max-width:calc(100% - 32px);width:max-content;
  display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;border-radius:18px;background:var(--text);color:var(--bg);font-size:15px;font-weight:560;
  box-shadow:0 14px 34px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translate(-50%,24px) scale(.94);transition:opacity .25s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.act{pointer-events:auto}
.toast button{border:0;background:var(--acc);color:var(--acc-ink);font-weight:750;border-radius:11px;padding:0 14px;min-height:38px;font-size:14.5px;flex:none}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.fx{position:fixed;inset:0;z-index:85;display:grid;place-items:center;pointer-events:none}
.fx-card{width:230px;text-align:center;background:var(--card);border-radius:30px;box-shadow:var(--sh2);padding:22px 20px 18px;animation:fxIn .5s cubic-bezier(.3,1.5,.5,1) both}
.fx-card.bye{animation:fxOut .35s ease-in both}
.fx-card .pigw{width:118px;margin:0 auto}
.fx-card b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--acc-text);margin-top:10px}
.fx-card b.minus{color:var(--muted)}
.fx-card span{font-size:14px;color:var(--muted);font-weight:600}
@keyframes fxIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fxOut{to{opacity:0;transform:scale(.9) translateY(-10px)}}

/* ---------- Animacije: pritisak, ulazak kartica, nagrada ---------- */
.xbtn,.pbtn,.mnow,.jopt-head,.wal-move,.emain,.toast button,button.note{transition:transform .32s cubic-bezier(.3,1.7,.5,1)}
.xbtn:active,.xbtn.is-pressed,.pbtn:active,.pbtn.is-pressed,.mnow:active,.mnow.is-pressed,.wal-move:active,.wal-move.is-pressed,.toast button:active,.toast button.is-pressed{transform:scale(.86);transition-duration:.08s}
.jopt-head:active,.jopt-head.is-pressed,.emain:active,.emain.is-pressed,button.note:active,button.note.is-pressed{transform:scale(.97);transition-duration:.08s}
.switch{transition:background .25s,transform .32s cubic-bezier(.3,1.7,.5,1)}
.switch:active,.switch.is-pressed{transform:scale(.92);transition-duration:.08s}
.switch:active::after,.switch.is-pressed::after{transform:scale(1.14,.88)}
.switch.on:active::after,.switch.on.is-pressed::after{transform:translateX(20px) scale(1.14,.88)}
.fab::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 3px var(--acc2);opacity:0;pointer-events:none}
.fab.ring::after{animation:fabRing .55s cubic-bezier(.2,.8,.3,1)}
@keyframes fabRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.65)}}
.stag{animation:cardIn .52s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--sd,0ms)}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.97)}to{opacity:1;transform:none}}
.okpop{position:fixed;left:50%;top:40%;z-index:87;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:linear-gradient(150deg,var(--acc2),var(--acc-deep));color:#fff;box-shadow:0 16px 36px rgba(22,163,74,.42);animation:okPop .95s cubic-bezier(.3,1.5,.5,1) both}
.okpop.amber{background:linear-gradient(150deg,#fcd34d,var(--amber));color:#3a2500;box-shadow:0 16px 36px rgba(217,119,6,.38)}
.okpop svg{width:44px;height:44px;stroke-width:2.8;animation:okTick .42s .1s cubic-bezier(.3,1.8,.5,1) both}
@keyframes okPop{0%{opacity:0;transform:scale(.35)}24%{opacity:1;transform:scale(1.1)}40%{transform:scale(.97)}52%{transform:scale(1)}76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translate3d(0,-16px,0) scale(.86)}}
@keyframes okTick{from{opacity:0;transform:scale(.2) rotate(-35deg)}to{opacity:1;transform:none}}

@media (hover:hover){
  .btn:not(.primary):not(:disabled):hover{filter:brightness(.97)}
  .day:not(.blank):hover{filter:brightness(.97)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ================== Pomoćne funkcije ================== */
var KEY = 'mesecna-zarada.v1';
var MONTHS = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
var DAYS = ['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
var WD = ['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
var $ = function(s, r){ return (r || document).querySelector(s); };

function fmt(n){
  n = Number(n);
  if (!isFinite(n)) n = 0;
  var r = Math.round(Math.abs(n));
  var s = r.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n < 0 && r > 0 ? '−' : '') + s;
}
function rsd(n){ return fmt(n) + ' RSD'; }
function compact(n){ return n < 100000 ? fmt(n) : Math.round(n / 1000) + 'k'; }
function short(n){ return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + 'k' : String(Math.round(n)); }
/* Iznos: tačka = hiljade (1.500), zarez = decimale (1500,50); nalepljeno „1500.50“ prevodi formatLive. Čuva se ceo dinar (zaokruženo). */
function splitAmt(v){
  var s = String(v == null ? '' : v).replace(/[\s\u00a0]/g, ''), i = s.lastIndexOf(',');
  var ip = i < 0 ? s : s.slice(0, i), dp = i < 0 ? null : s.slice(i + 1).replace(/\D/g, '').slice(0, 2);
  return { int: ip.replace(/\D/g, '').slice(0, 10).replace(/^0+(?=\d)/, ''), dec: dp, sep: i };
}
function parseAmt(v){
  var p = splitAmt(v);
  var n = (p.int ? parseInt(p.int, 10) : 0) + (p.dec ? parseInt(p.dec, 10) / Math.pow(10, p.dec.length) : 0);
  return isFinite(n) && n > 0 ? Math.round(n) : 0;
}
function plural(n, one, few, many){
  var a = Math.abs(n) % 10, b = Math.abs(n) % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
function dana(n){ return n + ' ' + plural(n, 'dan', 'dana', 'dana'); }
function radnih(n){ return n + ' ' + plural(n, 'radni dan', 'radna dana', 'radnih dana'); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function mkey(y, m){ return y + '-' + String(m + 1).padStart(2, '0'); }
function parseKey(k){ var p = k.split('-'); return { y: +p[0], m: +p[1] - 1 }; }
function shiftKey(k, delta){ var p = parseKey(k); var d = new Date(p.y, p.m + delta, 1); return mkey(d.getFullYear(), d.getMonth()); }
function dim(y, m){ return new Date(y, m + 1, 0).getDate(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
var TZF = null;
try { TZF = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Belgrade', year: 'numeric', month: '2-digit', day: '2-digit' }); } catch (e) {}
function nowParts(){
  var d = new Date();
  if (TZF && TZF.formatToParts) {
    try {
      var p = {};
      TZF.formatToParts(d).forEach(function(x){ p[x.type] = x.value; });
      var y = +p.year, m = +p.month - 1, dd = +p.day;
      if (y > 1970 && m >= 0 && m < 12 && dd >= 1) return { y: y, m: m, d: dd };
    } catch (e) {}
  }
  return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() };
}
function ds(y, m, d){ return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
function pd(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr(){ return ds(T.y, T.m, T.d); }
function daysBetween(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function addDaysStr(s, n){ var d = pd(s); d.setDate(d.getDate() + n); return ds(d.getFullYear(), d.getMonth(), d.getDate()); }
function fmtDate(s, year){ var d = pd(s); return d.getDate() + '. ' + MONTHS[d.getMonth()] + (year ? ' ' + d.getFullYear() : ''); }
function joinDays(list){
  var a = list.map(function(d){ return d + '.'; });
  if (a.length <= 1) return a.join('');
  return a.slice(0, -1).join(', ') + ' i ' + a[a.length - 1];
}
function roundUp(x){ return x <= 50 ? Math.ceil(x) : Math.ceil(x / 50) * 50; }
function isWork(r){ return !!(r && r.entries && r.entries.length); }
function isOff(r){ return !!(r && r.off && !isWork(r)); }
function hasStatus(r){ return isWork(r) || isOff(r); }
function sumDay(r){
  var s = 0;
  if (isWork(r)) r.entries.forEach(function(e){ s += (e.wage || 0) + (e.tip || 0); });
  return s;
}
function tipDay(r){ var s = 0; if (isWork(r)) r.entries.forEach(function(e){ s += e.tip || 0; }); return s; }
function spendDay(r){ var s = 0; if (r && r.spend) r.spend.forEach(function(x){ s += x.amount || 0; }); return s; }
function recAt(dateStr){
  var d = pd(dateStr), md = state.months[mkey(d.getFullYear(), d.getMonth())];
  return md ? md.days[d.getDate()] : null;
}

/* ================== Podaci (ista struktura i isti ključ kao ranije) ================== */
function emptyState(){
  return { v: 2, jobs: [], mainJobId: null, months: {}, wallet: [], jars: [], jarTx: [], debts: [], debtTx: [],
    settings: { sound: true, tipShare: 30 } };
}
function toInt(v){ var n = parseInt(v, 10); return isFinite(n) && n > 0 ? n : 0; }
function toSigned(v){ var n = parseInt(v, 10); return isFinite(n) ? n : 0; }
function okDate(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; }

function normalize(s){
  var out = emptyState();
  if (!s || typeof s !== 'object') s = {};
  if (Array.isArray(s.jobs)) {
    out.jobs = s.jobs.filter(function(j){ return j && j.id; }).map(function(j){
      return { id: String(j.id), name: String(j.name || ''), rate: toInt(j.rate) };
    });

  var md = monthFor(curKey), st = computeStats(md, curKey), r = md.days[T.d];
  var earned = sumDay(r), tip = tipDay(r), spent = spendDay(r), target = null;

/* Kratki pametni saveti za tekući mesec (ista pravila kao ranija upozorenja) */
function homeTips(md, st){
  var out = [], mName = MONTHS[st.m];
  if (loggedIn() && syncStatus === 'err') out.push({ k: 'red', ic: 'cloud', t: 'Sinhronizacija ne radi', s: syncMsg, act: 'open-settings', long: esc(syncMsg) });
  if (!storageOk) out.push({ k: 'red', ic: 'warn', t: 'Podaci se ne čuvaju', s: 'Možda je uključen privatni režim',
    long: 'Ovaj pregledač ne dozvoljava čuvanje (možda je uključen privatni režim). Otvori aplikaciju u običnom prozoru.' });
  if (!state.jobs.length) out.push({ k: 'gray', ic: 'briefcase', t: 'Za početak dodaj posao', s: 'Naziv i dnevnica', act: 'focus-job',
    long: 'Dodaj posao i njegovu dnevnicu, upiši mesečni cilj, pa dodirni dan u kalendaru da ga upišeš.' });
  if (st.missing.length) {
    var c = st.missing.length;
    out.push({ k: 'red', ic: 'cal', t: c === 1 ? 'Neupisan dan' : c + ' ' + plural(c, 'neupisan dan', 'neupisana dana', 'neupisanih dana'),
      s: joinDays(st.missing) + ' ' + mName, act: 'open-day', day: st.missing[0], go: 'Upiši',
      long: 'Nije upisano: <b>' + joinDays(st.missing) + ' ' + mName + '</b>. Upiši šta si radio ili označi slobodan dan, da računica bude tačna.' });
  }
  var late = [], soon = [];
  md.expenses.forEach(function(e){
    if (e.paid || !e.due || !e.amount) return;
    var s2 = dueState(e, st);
    if (s2 === 'late') late.push(e); else if (s2 === 'soon') soon.push(e);
  });
  if (late.length) {
    var sumL = late.reduce(function(s, e){ return s + e.amount; }, 0);
    out.push({ k: 'red', ic: 'bill', t: 'Kasni plaćanje', s: late.map(function(e){ return esc(e.name || 'Trošak'); }).join(', ') + ' · ' + rsd(sumL), act: 'goto-exp',
      long: late.map(function(e){ return '<b>' + esc(e.name || 'Trošak') + '</b> (' + rsd(e.amount) + ', rok ' + e.due + '.)'; }).join(', ') +
        '. Ukupno ' + rsd(sumL) + '. Kad platiš, štikliraj ga u troškovima.' });
  }
  if (soon.length) {
    out.push({ k: 'amber', ic: 'bill', t: 'Uskoro rok plaćanja', s: soon.map(function(e){ return esc(e.name || 'Trošak') + ' (' + (e.due === T.d ? 'danas' : e.due + '.') + ')'; }).join(', '), act: 'goto-exp',
      long: soon.map(function(e){ return '<b>' + esc(e.name || 'Trošak') + '</b> (' + rsd(e.amount) + ', rok ' + (e.due === T.d ? 'danas' : e.due + '.') + ')'; }).join(', ') + '.' });
  }
  var pk = shiftKey(curKey, -1), pm = state.months[pk];
  if (pm) {
    var ps = computeStats(pm, pk), waiting = Object.keys(ps.jobs).filter(function(j){ return ps.jobs[j].wages > 0 && !pm.payouts[j]; });
    if (waiting.length) out.push({ k: 'gray', ic: 'bank', t: 'Plata za ' + MONTHS[ps.m], s: 'Upiši koliko je leglo', act: 'goto-pay', key: pk,
      long: 'Još nije upisano koliko je leglo za: <b>' + waiting.map(function(j){ return esc(ps.jobs[j].name); }).join(', ') + '</b>.' });
  }
  if (st.goal <= 0) {
    out.push({ k: 'gray', ic: 'target', t: 'Postavi mesečni cilj', s: 'Pa računam koliko ti fali', act: 'focus-goal',
      long: 'Upiši koliko želiš da zaradiš ovog meseca (ili uključi „Zbir troškova“), pa će aplikacija računati koliko ti fali.' });
    return out;
  }
  var note = st.missing.length ? ' <i>(Neupisani dani nisu uračunati.)</i>' : '';
  if (st.remaining <= 0) {
    out.push({ k: 'green', ic: 'party', t: 'Cilj ostvaren!', s: st.over > 0 ? rsd(st.over) + ' preko cilja' : 'Tačno do dinara', calc: true,
      long: 'Zarađeno <b>' + rsd(st.earned) + '</b> od cilja ' + rsd(st.goal) + '.' });
    return out;
  }
  var rd = st.remainingDays;
  if (rd === 0) {
    out.push({ k: 'red', ic: 'warn', t: 'Mesec se završava', s: 'Do cilja fali ' + rsd(st.remaining), calc: true,
      long: 'Nema više dana u mesecu, a do cilja fali <b>' + rsd(st.remaining) + '</b>.' + note });
  } else if (st.daysNeeded !== null && st.daysNeeded > rd) {
    var src = st.avgSource === 'avg' ? 'prosečnoj zaradi' : 'dnevnici';
    out.push({ k: 'red', ic: 'warn', t: 'Ne stižeš cilj', s: 'Ni uz rad svaki preostali dan', calc: true,
      long: 'Čak i da radiš svaki preostali dan (još <b>' + dana(rd) + '</b>), po ' + src + ' od <b>' + rsd(st.avg) + '</b> stižeš najviše do oko <b>' +
        rsd(st.maxPossible) + '</b> — i dalje fali <b>' + rsd(st.goal - st.maxPossible) + '</b>. Potrebno je još <b>' + radnih(st.daysNeeded) +
        '</b>, a u mesecu je ostalo ' + dana(rd) + '.' + note });
  } else if (st.projection !== null && st.projection < st.goal - 0.5) {
    var tail = st.daysNeeded !== null ? ', odnosno još <b>' + radnih(st.daysNeeded) + '</b> (u mesecu je ostalo ' + dana(rd) + ')' : '';
    out.push({ k: 'amber', ic: 'trend', t: 'Ovim tempom fali oko ' + rsd(st.goal - st.projection), s: 'Treba ' + rsd(Math.ceil(st.perDayNeeded - 1e-9)) + ' dnevno', calc: true,
      long: 'Do sada zarađuješ prosečno <b>' + rsd(st.pace) + '</b> po danu (računajući i slobodne dane). Tim tempom do kraja meseca stižeš do oko <b>' +
        rsd(st.projection) + '</b> — to je <b>' + rsd(st.goal - st.projection) + '</b> manje od cilja. Da stigneš cilj, treba ti <b>' +
        rsd(Math.ceil(st.perDayNeeded - 1e-9)) + '</b> dnevno' + tail + '.' + note });
  } else if (st.projection !== null) {
    out.push({ k: 'green', ic: 'check', t: 'Dobar tempo', s: 'Stižeš do oko ' + rsd(st.projection), calc: true,
      long: 'Dobar tempo — ovako do kraja meseca stižeš do oko <b>' + rsd(st.projection) + '</b>, što je dovoljno za cilj.' + note });
  } else {
    out.push({ k: 'gray', ic: 'cal', t: 'Upiši prvi dan', s: 'Pa pratim tvoj tempo', act: 'open-today',
      long: 'Tempo se računa kad upišeš bar jedan dan (radni ili slobodan). Do cilja fali <b>' + rsd(st.remaining) + '</b>.' });
  }
  return out;
}

/* ---------- Kalendar ---------- */
function renderCalendar(){
  var p = parseKey(viewKey), y = p.y, m = p.m, n = dim(y, m);
  var md = monthFor(viewKey);
  var cmp = (y * 12 + m) - (T.y * 12 + T.m);
  var track = !!state.months[viewKey] || viewKey === curKey;
  var lead = (new Date(y, m, 1).getDay() + 6) % 7;
  var h = '', d;
  for (d = 0; d < lead; d++) h += '<div class="day blank"></div>';
  for (d = 1; d <= n; d++) {
    var r = md.days[d];
    var isToday = cmp === 0 && d === T.d;
    var isFuture = cmp > 0 || (cmp === 0 && d > T.d);
    var cls = 'day', inner = '<span class="dn">' + d + '</span>', desc;
    if (isWork(r)) {
      var tot = sumDay(r), ttp = tipDay(r), twg = tot - ttp;
      cls += ' work';
      inner += '<span class="amt w">' + short(twg) + '</span>' + (ttp ? '<span class="amt t">+' + short(ttp) + '</span>' : '');
      if (r.entries.length > 1) inner += '<span class="multi">' + new Array(Math.min(r.entries.length, 3) + 1).join('<i></i>') + '</span>';
      desc = 'radni dan, dnevnica ' + rsd(twg) + ', bakšiš ' + rsd(ttp);
    } else if (isOff(r)) {
      cls += ' off'; desc = 'slobodan dan';
    } else if (isFuture) {
      cls += ' future'; desc = 'još nije došao';
    } else if (!isToday && track) {
      cls += ' missing'; inner += '<span class="amt">upiši</span>'; desc = 'neupisan';
    } else desc = 'nije upisan';
    if (spendDay(r) > 0) { inner += '<span class="sp"></span>'; desc += ', potrošeno ' + rsd(spendDay(r)); }
    if (isToday) { cls += ' today'; desc += ', danas'; }
    h += '<button type="button" class="' + cls + '" data-act="day" data-day="' + d + '" aria-label="' + d + '. ' + MONTHS[m] + ', ' + desc + '">' + inner + '</button>';
  }
  setHTML($('#calGrid'), h);
  var note = $('#calNote');
  if (!state.months[viewKey]) { note.hidden = false; note.textContent = 'Za ovaj mesec još nema evidencije. Dodirni dan da počneš da upisuješ.'; }
  else note.hidden = true;
}
function popDay(key, d){
  if (key !== viewKey || reduced()) return;
  var b = byAttr($('#calGrid'), 'data-day', String(d));
  if (b) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
}

function stat(t){ return '<div class="stat"><div class="k">' + t[0] + '</div><div class="v num">' + t[1] + '</div><div class="s">' + t[2] + '</div></div>'; }
function tilesData(st){
  var past = st.cmp < 0, out = [];
  out.push(['Zarađeno', fmt(st.earned) + ' <small>RSD</small>', 'dnevnice ' + fmt(st.wages) + ' · bakšiš ' + fmt(st.tips)]);
  out.push(['Potrošeno', fmt(st.spend) + ' <small>RSD</small>', 'dnevna potrošnja · plaćeni troškovi ' + fmt(st.paidExp)]);
  var v2, s2;
  if (past) { v2 = '—'; s2 = 'mesec je završen'; }
  else if (st.goal <= 0) { v2 = '—'; s2 = 'nije postavljen cilj'; }
  else if (st.remaining <= 0) { v2 = '0 <small>RSD</small>'; s2 = 'cilj je ostvaren'; }
  else if (!st.remainingDays) { v2 = '—'; s2 = 'nema preostalih dana'; }
  else { v2 = fmt(Math.ceil(st.perDayNeeded - 1e-9)) + ' <small>RSD</small>'; s2 = 'preostalo: ' + dana(st.remainingDays); }
  out.push(['Dnevno treba', v2, s2]);
  var v3, s3;
  if (past) { v3 = '—'; s3 = 'mesec je završen'; }
  else if (st.goal <= 0) { v3 = '—'; s3 = 'nije postavljen cilj'; }
  else if (st.remaining <= 0) { v3 = '0'; s3 = 'cilj je ostvaren'; }
  else if (st.daysNeeded === null) { v3 = '—'; s3 = 'dodaj posao sa dnevnicom'; }
  else {
    v3 = st.daysNeeded + ' <small>' + plural(st.daysNeeded, 'dan', 'dana', 'dana') + '</small>';
    s3 = st.avgSource === 'avg' ? 'po proseku ' + fmt(st.avg) + ' RSD po radnom danu' : 'po dnevnici: ' + esc(st.mainName) + ' (' + fmt(st.avg) + ' RSD)';
  }
  out.push(['Još dana rada', v3, s3]);
  out.push(['Radni dani', String(st.workDays), 'slobodnih: ' + st.offDays + (st.missing.length ? ' · neupisanih: ' + st.missing.length : '')]);
  out.push(['U kasice', fmt(st.deposited) + ' <small>RSD</small>', 'ovog meseca · ukupno ušteđeno ' + fmt(totalSaved())]);
  return out;
}

function renderSummary(){
  var md = monthFor(viewKey), st = computeStats(md, viewKey), past = st.cmp < 0, mName = MONTHS[st.m], h = '';
  if (st.missing.length) {
    var c = st.missing.length;
    h += '<div class="note red"><b>' + (c === 1 ? 'Neupisan dan' : c + ' ' + plural(c, 'neupisan dan', 'neupisana dana', 'neupisanih dana')) + ':</b> ' +
      joinDays(st.missing) + ' ' + mName + '. Dodirni crveni dan i upiši rad ili slobodan dan, da računica bude tačna.</div>';
  }
  h += '<section class="card"><div class="card-h"><h2>' + hic('chart', 'g') + 'Pregled meseca</h2>' + ibtn('info-month', 'Kako se računa') + '</div>' +
    '<div class="sum-ost"><span>' + (past ? 'Ostalo ti je' : 'Ostaje ti') + '</span><b class="num' + (st.ostaje < 0 ? ' neg' : '') + '">' + countSpan('sum-ost', st.ostaje) + ' RSD</b></div>';
  if (st.goal > 0) {
    h += '<div class="goal-line">' + bar('sum-' + viewKey, st.pct, past && st.remaining > 0 ? 'amber' : '') +
      '<div class="bar-meta num"><span><b>' + Math.floor(st.pct) + '%</b> cilja · ' +
      (st.remaining > 0 ? (past ? 'falilo je ' : 'fali ') + rsd(st.remaining) : 'ostvaren' + (st.over > 0 ? ', +' + rsd(st.over) : '')) +
      '</span><span><b>' + fmt(st.earned) + '</b> od ' + rsd(st.goal) + '</span></div></div>';
  } else {
    h += '<button type="button" class="note gray" data-act="goal-view" style="box-shadow:none;background:var(--card2)">Cilj za ' + mName + ' nije postavljen — <b>postavi ga</b> ›</button>';
  }
  h += '<div class="stats">' + tilesData(st).map(stat).join('') + '</div>';
  if (past && st.goal > 0) {
    h += '<div class="note ' + (st.remaining > 0 ? 'amber' : 'green') + '" style="margin:14px 0 0">' +
      (st.remaining > 0 ? '<b>Mesec je završen.</b> Cilj nije ostvaren — zarađeno <b>' + rsd(st.earned) + '</b> od ' + rsd(st.goal) + ', falilo je <b>' + rsd(st.remaining) + '</b>.' +
        (st.missing.length ? ' <i>(Neupisani dani nisu uračunati.)</i>' : '')
        : '<b>Mesec je završen.</b> Cilj je ostvaren: <b>' + rsd(st.earned) + '</b> od ' + rsd(st.goal) + '.') + '</div>';
  }
  h += '</section>';
  setHTML($('#summary'), h);
}

function payStatus(calc, amt){

  return '<span class="badge ' + (diff < 0 ? 'red' : 'green') + '">isplaćeno, ' + (diff < 0 ? 'fali ' + rsd(-diff) : '+' + rsd(diff)) + '</span>';
}

function renderJars(){
